<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#080F2B">
<meta name="robots" content="noindex, nofollow">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Szerkesztőség">
<title>Szerkesztőség | Tények++</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icons/staff-192.png" type="image/png">
<link rel="apple-touch-icon" href="../icons/staff-apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --font:"Archivo","Helvetica Neue",Arial,system-ui,sans-serif;
  --bg:#080F2B;
  --surface:#111A42;
  --surface-2:#18235A;
  --ink:#EEF1FC;
  --muted:#A4AED0;
  --line:#27336B;
  --brand:#3C57F5;
  --on-brand:#FFFFFF;
  --link:#9DACFF;
  --strap:#FFD21F;
  --on-strap:#0B1533;
  --ok:#5BD9A0;
  --danger:#FF8A93;
  --nav-h:4.25rem;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1.0625rem;line-height:1.5;padding-top:env(safe-area-inset-top,0px)}
body.has-nav{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 1.5rem)}
h1,h2,h3,p{margin:0}
a{color:var(--link)}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--link);outline-offset:2px;border-radius:6px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.wrap{width:100%;max-width:46rem;margin-inline:auto;padding-inline:1rem}
main:focus{outline:none}

.top{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding-block:.85rem}
.brand{display:flex;align-items:center;gap:.6rem;min-width:0}
.logo{display:inline-flex;align-items:center;gap:.14em;font-weight:900;font-stretch:125%;font-size:1.3rem;letter-spacing:-.02em;line-height:1;color:var(--ink);text-decoration:none}
.logo b{background:var(--strap);color:var(--on-strap);padding:.06em .2em .1em;border-radius:5px;letter-spacing:0}
.tag{padding:.15rem .55rem;border:1.5px solid var(--line);border-radius:999px;font-size:.8rem;font-weight:700;color:var(--muted);white-space:nowrap}
.who{font-size:.9rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:12rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:46px;padding:.6rem 1.1rem;border:0;border-radius:10px;background:var(--brand);color:var(--on-brand);font:inherit;font-weight:700;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{background:color-mix(in srgb,var(--brand) 86%,#000)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.btn.small{min-height:40px;padding:.4rem .8rem;font-size:.92rem}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid color-mix(in srgb,var(--danger) 45%,transparent)}
.btn.danger:hover{background:color-mix(in srgb,var(--danger) 12%,transparent)}
.btn.yellow{background:var(--strap);color:var(--on-strap)}
.btn.yellow:hover{background:#F2C400}
.btn[disabled]{opacity:.6;cursor:progress}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;flex:none;border:0;border-radius:10px;background:transparent;color:var(--muted);font:inherit;font-size:1.25rem;cursor:pointer}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}

.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem;margin:.75rem 0 1rem}
.head h1{font-size:2rem;font-weight:900;font-stretch:122%;line-height:1;letter-spacing:-.02em}
.sub{margin:-.4rem 0 1rem;color:var(--muted);font-size:.92rem}
.back{display:inline-flex;align-items:center;min-height:44px;font-weight:700;text-decoration:none}

.list{display:grid;gap:.6rem;list-style:none;margin:0;padding:0}
.card{display:block;padding:.85rem 1rem;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:inherit;text-decoration:none}
a.card:hover{border-color:color-mix(in srgb,var(--link) 60%,var(--line))}
.card h2,.card h3{font-size:1.05rem;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.card.ep{display:grid;grid-template-columns:7.5rem 1fr;gap:.85rem;align-items:center;padding:.7rem}
.thumb{position:relative;aspect-ratio:16/9;border-radius:9px;overflow:hidden;background:linear-gradient(135deg,#2B48F0,#101C5C)}
.thumb img{width:100%;height:100%;object-fit:cover}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem .6rem;margin-top:.35rem;font-size:.84rem;color:var(--muted)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.45rem}
.card-top time,.card-top .when{font-size:.8rem;color:var(--muted);white-space:nowrap}
.snip{margin-top:.25rem;color:var(--muted);font-size:.92rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:1.5rem 1.25rem;border:1.5px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}
.empty.small{padding:.9rem 1rem;font-size:.92rem;text-align:left}

.pill{display:inline-flex;align-items:center;gap:.35rem;padding:.1rem .55rem;border-radius:999px;border:1.5px solid var(--line);color:var(--ink);font-weight:700;font-size:.78rem;line-height:1.5;white-space:nowrap}
.pill::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:var(--dot,var(--muted))}
.pill.plain::before{display:none}
.s-beerkezett{--dot:#FFD21F}
.s-otlet{--dot:#9DACFF}
.s-tervezes{--dot:#6FD3FF}
.s-forgatas{--dot:#FF9F5A}
.s-vagas{--dot:#D38BFF}
.s-kesz{--dot:#5BD9A0}
.s-megjelent{--dot:#FFFFFF}
.s-elvetve{--dot:#6B7499}
.hidden-pill{--dot:#FF8A93}

.progress{display:flex;align-items:center;gap:.5rem;margin-top:.55rem;font-size:.8rem;color:var(--muted)}
.bar{flex:1;height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--ok);border-radius:999px}

.chips{display:flex;gap:.4rem;overflow-x:auto;margin:0 -1rem 1rem;padding:0 1rem .25rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:.4rem;min-height:40px;padding:0 .9rem;border:1.5px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);font:inherit;font-size:.92rem;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{font-weight:600;opacity:.7}

.form{display:grid;gap:1.1rem}
.field label,.field .lbl{display:block;margin-bottom:.35rem;font-weight:700}
.field small{font-weight:500;color:var(--muted)}
input[type="text"],input[type="email"],input[type="password"],input[type="url"],input[type="date"],input[type="datetime-local"],input[type="tel"],input[type="search"],textarea,select{width:100%;min-height:48px;padding:.7rem .85rem;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
textarea{min-height:8rem;resize:vertical}
textarea.tall{min-height:16rem}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 1.15rem) 50%,calc(100% - .8rem) 50%;background-size:.35rem .35rem;background-repeat:no-repeat;padding-right:2.2rem}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--link);outline-offset:1px;border-color:var(--link)}
.field.bad input,.field.bad textarea{border-color:var(--danger)}
.err{margin-top:.35rem;font-size:.88rem;font-weight:600;color:var(--danger)}
.hint{margin-top:.35rem;font-size:.85rem;color:var(--muted)}
.row2{display:grid;gap:1.1rem}
@media (min-width:34rem){.row2{grid-template-columns:1fr 1fr}}
.preview{margin-top:.6rem;max-width:18rem}
.switch{display:flex;align-items:flex-start;gap:.75rem;padding:.85rem 1rem;border-radius:12px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.switch input{appearance:none;flex:none;position:relative;width:2.9rem;height:1.7rem;margin:0;border-radius:999px;background:var(--line);cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.3rem;height:1.3rem;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--brand)}
.switch input:checked::after{transform:translateX(1.2rem)}
.switch strong{display:block;line-height:1.3}
.switch span span{display:block;font-size:.85rem;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.actions .grow{flex:1}
.slug{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.danger-zone{margin-top:.5rem;padding-top:1.25rem;border-top:1px solid var(--line)}
.counter{float:right;font-weight:500;font-size:.82rem;color:var(--muted)}
.title-input{font-size:1.5rem !important;font-weight:800;font-stretch:112%}

.statusset{display:flex;flex-wrap:wrap;gap:.4rem;margin:0;padding:0;border:0}
.statusset label{position:relative}
.statusset input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.statusset span{display:inline-flex;align-items:center;gap:.4rem;min-height:42px;padding:0 .85rem;border:1.5px solid var(--line);border-radius:999px;font-weight:700;font-size:.92rem}
.statusset span::before{content:"";width:.55rem;height:.55rem;border-radius:50%;background:var(--dot)}
.statusset input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.statusset input:focus-visible+span{outline:3px solid var(--link);outline-offset:2px}

.section{display:grid;gap:.85rem;padding:1rem;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.section>h2{display:flex;align-items:center;justify-content:space-between;gap:.5rem;font-size:1.1rem;font-weight:800;font-stretch:110%}
.section>h2 small{font-size:.85rem;font-weight:600;color:var(--muted)}
.section .field input,.section .field textarea,.section .field select,.section input[type="text"],.section input[type="url"],.section select{background:var(--bg)}
.info dl{display:grid;grid-template-columns:auto 1fr;gap:.35rem 1rem;margin:0;font-size:.95rem}
.info dt{color:var(--muted)}
.info dd{margin:0;overflow-wrap:anywhere}
.body-text{white-space:pre-wrap;overflow-wrap:anywhere}
.kind{font-size:.85rem;font-weight:700;color:var(--strap);text-transform:uppercase;letter-spacing:.06em}
.detail-title{margin:.35rem 0 1rem;font-size:1.7rem;font-weight:900;font-stretch:115%;line-height:1.1;overflow-wrap:anywhere}

.checks{display:grid;gap:.15rem;list-style:none;margin:0;padding:0}
.check{display:flex;align-items:center;gap:.6rem;min-height:44px;padding:0 .25rem 0 .5rem;border-radius:10px}
.check:hover{background:var(--surface-2)}
.check input{flex:none;width:1.3rem;height:1.3rem;margin:0;accent-color:var(--ok);cursor:pointer}
.check label{flex:1;cursor:pointer;overflow-wrap:anywhere}
.check.done label{color:var(--muted);text-decoration:line-through}
.addrow{display:flex;gap:.5rem}
.addrow input{flex:1;min-width:0}
.res{display:flex;align-items:center;gap:.75rem;padding:.55rem .25rem .55rem .65rem;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.res .ic{display:grid;place-items:center;width:2.2rem;height:2.2rem;flex:none;border-radius:9px;background:var(--surface-2);font-size:1.05rem}
.res .txt{flex:1;min-width:0}
.res .txt a,.res .txt strong{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .txt span{display:block;font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resform{display:grid;gap:.5rem}
@media (min-width:34rem){.resform{grid-template-columns:9rem 1fr 1fr auto}}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin-bottom:1.1rem}
@media (min-width:40rem){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{display:block;padding:.85rem 1rem;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:inherit;text-decoration:none}
.stat b{display:block;font-size:1.9rem;font-weight:900;font-stretch:118%;line-height:1}
.stat span{display:block;margin-top:.3rem;font-size:.85rem;color:var(--muted);font-weight:600}
.stat.hot{border-color:var(--strap)}
.stat.hot b{color:var(--strap)}
.quick{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.25rem}
.stack{display:grid;gap:1.1rem}
.date-tile{display:grid;place-items:center;width:3.2rem;flex:none;padding:.35rem 0;border-radius:10px;background:var(--surface-2);line-height:1.1;text-align:center}
.date-tile b{font-size:1.3rem;font-weight:900}
.date-tile span{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase}
.card.row{display:flex;align-items:center;gap:.85rem}
.card.row .grow{flex:1;min-width:0}

.menu{display:grid;list-style:none;margin:0;padding:0;border-radius:16px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.menu li+li{border-top:1px solid var(--line)}
.menu a,.menu button{display:flex;align-items:center;gap:.85rem;width:100%;min-height:58px;padding:.6rem 1rem;border:0;background:none;color:var(--ink);font:inherit;font-weight:700;text-align:left;text-decoration:none;cursor:pointer}
.menu a:hover,.menu button:hover{background:var(--surface-2)}
.menu .ic{display:grid;place-items:center;width:2.2rem;height:2.2rem;border-radius:10px;background:var(--surface-2);font-size:1.1rem}
.menu small{display:block;font-weight:500;color:var(--muted);font-size:.85rem}
.menu .n{margin-left:auto;color:var(--muted);font-weight:600}

.mail-preview{white-space:pre-wrap;overflow-wrap:anywhere;padding:1rem;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:.95rem}
.mail-preview strong{display:block;margin-bottom:.6rem}
.ph{padding:0 .2rem;border-radius:4px;background:color-mix(in srgb,var(--strap) 25%,transparent);color:var(--strap)}
.msg{padding:.8rem 1rem;border-left:5px solid var(--danger);border-radius:0 10px 10px 0;background:var(--surface-2);font-weight:600}
.center{min-height:calc(100dvh - 6rem);display:grid;place-items:center;padding-block:2rem}
.login{width:100%;max-width:24rem;display:grid;gap:1.1rem;padding:1.5rem;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.login h1{font-size:1.6rem;font-weight:900;font-stretch:118%;line-height:1.1}
.login p{color:var(--muted)}
.loading{padding-block:3rem;color:var(--muted);font-weight:600;text-align:center}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.nav-in{display:grid;grid-template-columns:repeat(5,1fr);max-width:46rem;margin-inline:auto;height:var(--nav-h)}
.nav a{position:relative;display:grid;place-items:center;align-content:center;gap:.15rem;color:var(--muted);text-decoration:none;font-size:.72rem;font-weight:700}
.nav a svg{width:1.45rem;height:1.45rem}
.nav a[aria-current="page"]{color:var(--ink)}
.nav a[aria-current="page"]::before{content:"";position:absolute;top:0;width:2.2rem;height:3px;border-radius:0 0 3px 3px;background:var(--strap)}
.badge{position:absolute;top:.5rem;left:calc(50% + .35rem);min-width:1.2rem;height:1.2rem;padding:0 .3rem;border-radius:999px;background:var(--strap);color:var(--on-strap);font-size:.7rem;font-weight:800;line-height:1.2rem;text-align:center}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + .9rem);z-index:30;transform:translate(-50%,1rem);width:max-content;max-width:calc(100% - 2rem);padding:.75rem 1.1rem;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--danger);color:#2A0710}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none !important}}
</style>
</head>
<body>
<header class="wrap top" id="top" hidden>
  <div class="brand">
    <a class="logo" href="#/" aria-label="Tények++ Szerkesztőség, áttekintés">Tények<b>++</b></a>
    <span class="tag">Szerkesztőség</span>
  </div>
  <span class="who" id="who"></span>
</header>

<main id="main" tabindex="-1"><div class="wrap"><p class="loading" role="status">Betöltés…</p></div></main>

<nav class="nav" id="nav" aria-label="Fő menü" hidden>
  <div class="nav-in">
    <a href="#/" data-nav="attekintes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>Áttekintés</a>
    <a href="#/tervek" data-nav="tervek"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="m9 12 2 2 4-4"/></svg>Tervek</a>
    <a href="#/sztorik" data-nav="sztorik"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5h16v11H8.5L4 19.5z"/><path d="M8 9h8M8 12h5"/></svg>Sztorik<span class="badge" id="badge" hidden></span></a>
    <a href="#/adasok" data-nav="adasok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="m10 9.5 4.5 2.5-4.5 2.5z"/></svg>Adások</a>
    <a href="#/tobb" data-nav="tobb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>Több</a>
  </div>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"></script>
<script>
const CFG = window.TENYEK_CONFIG || {};
const SITE = new URL("../", location.href).href;

const STORY_STATUSES = [["beerkezett", "Beérkezett"], ["otlet", "Ötlet"], ["forgatas", "Forgatás"], ["vagas", "Vágás"], ["kesz", "Kész"], ["elvetve", "Elvetve"]];
const STORY_LABEL = Object.fromEntries(STORY_STATUSES);
const STORY_ACTIVE = ["beerkezett", "otlet", "forgatas", "vagas"];
const PLAN_STATUSES = [["otlet", "Ötlet"], ["tervezes", "Tervezés"], ["forgatas", "Forgatás"], ["vagas", "Vágás"], ["kesz", "Kész"], ["megjelent", "Megjelent"]];
const PLAN_LABEL = Object.fromEntries(PLAN_STATUSES);
const KINDS = [["nyersanyag", "Nyersanyag", "🎞️"], ["forgatokonyv", "Forgatókönyv", "📝"], ["zene", "Zene", "🎵"], ["kep", "Kép", "🖼️"], ["grafika", "Grafika", "✨"], ["dokumentum", "Dokumentum", "📄"], ["egyeb", "Egyéb", "🔗"]];
const KIND_LABEL = Object.fromEntries(KINDS.map(k => [k[0], k[1]]));
const KIND_ICON = Object.fromEntries(KINDS.map(k => [k[0], k[2]]));
const DEFAULT_CHECKLIST = ["Téma és szempontok kitalálva", "Interjúalanyok megkeresve", "Forgatási engedély megvan", "Forgatókönyv kész", "Forgatás", "Vágás", "Feltöltés YouTube-ra", "Közzététel az oldalon"];
const PH_LABEL = { nev: "Címzett neve", tema: "Téma", datum: "Dátum", idopont: "Időpont", helyszin: "Helyszín", link: "Link", alairas: "Aláírás" };

const main = document.getElementById("main");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ytId = v => {
  const s = String(v || "").trim();
  const m = s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/);
  if (m) return m[1];
  return /^[\w-]{11}$/.test(s) ? s : "";
};
const slugify = s => String(s || "")
  .normalize("NFD").replace(/[̀-ͯ]/g, "")
  .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 80).replace(/-+$/g, "");
const fmtDate = new Intl.DateTimeFormat("hu-HU", { year: "numeric", month: "short", day: "numeric" });
const fmtDay = new Intl.DateTimeFormat("hu-HU", { month: "long", day: "numeric", weekday: "long" });
const fmtDateTime = new Intl.DateTimeFormat("hu-HU", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
const fmtTime = new Intl.DateTimeFormat("hu-HU", { hour: "2-digit", minute: "2-digit" });
const fmtMonth = new Intl.DateTimeFormat("hu-HU", { month: "short" });
const fmtLongDate = new Intl.DateTimeFormat("hu-HU", { year: "numeric", month: "long", day: "numeric" });
const dayDate = s => fmtDate.format(new Date(s + "T12:00:00"));
const pad = n => String(n).padStart(2, "0");
const isoDay = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayIso = () => isoDay(new Date());
const toLocalInput = iso => {
  if (!iso) return "";
  const d = new Date(iso);
  return `${isoDay(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
};
const fromLocalInput = v => v ? new Date(v).toISOString() : null;
const ago = iso => {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return "most";
  if (diff < 3600) return `${Math.floor(diff / 60)} perce`;
  if (diff < 86400) return `${Math.floor(diff / 3600)} órája`;
  if (diff < 86400 * 7) return `${Math.floor(diff / 86400)} napja`;
  return fmtDate.format(new Date(iso));
};
const safeHref = u => /^https?:\/\//i.test(String(u || "").trim()) ? String(u).trim() : "";
const isEmail = s => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(s || "").trim());
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());

let toastTimer;
function toast(text, bad) {
  const t = document.getElementById("toast");
  t.textContent = text;
  t.classList.toggle("bad", !!bad);
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), bad ? 5000 : 2600);
}

function chrome(on) {

function errText(error) {
  const m = String((error && (error.message || error.error_description)) || error || "");
  if (/Invalid login credentials/i.test(m)) return "Hibás e-mail-cím vagy jelszó.";
  if (/Email not confirmed/i.test(m)) return "Ezt az e-mail-címet még nem erősítették meg.";
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Nincs kapcsolat a szerverrel. Ellenőrizd az internetet.";
  if (error && error.code === "23505") return "Ez az azonosító már foglalt. Adj meg másikat.";
  if (error && error.code === "42501") return "Ehhez nincs jogosultságod.";
  if (error && error.code === "42P01") return "Hiányzik egy adatbázistábla. Futtasd le a newsroom.sql-t a Supabase-ben.";
  return m || "Ismeretlen hiba történt.";
}

const staffName = id => (S.staff.find(s => s.user_id === id) || {}).name || "";
const firstName = n => String(n || "").split(" ").slice(-1)[0];
const planById = id => S.plans.find(p => p.id === id);
const epById = id => S.episodes.find(e => e.id === id);
const epUrl = id => `${SITE}#/adas/${encodeURIComponent(id)}`;
const checkProgress = p => {
  const list = Array.isArray(p.checklist) ? p.checklist : [];
  return { done: list.filter(c => c.done).length, all: list.length };
};

function replaceIn(list, row, key = "id") {
  const i = list.findIndex(x => x[key] === row[key]);
  if (i >= 0) list[i] = row; else list.unshift(row);
}
function removeFrom(list, id, key = "id") {
  const i = list.findIndex(x => x[key] === id);
  if (i >= 0) list.splice(i, 1);
}

async function dbInsert(table, row) {
  const r = await S.sb.from(table).insert(row).select().single();
  if (r.error) throw r.error;
  return r.data;
}
async function dbUpdate(table, id, row, key = "id") {
  const r = await S.sb.from(table).update(row).eq(key, id).select().single();
  if (r.error) throw r.error;
  return r.data;
}
async function dbDelete(table, id, key = "id") {
  const r = await S.sb.from(table).delete().eq(key, id);
  if (r.error) throw r.error;
}

async function loadAll() {
  const q = (t, build) => build(S.sb.from(t).select("*"));
  const res = await Promise.all([
    q("episodes", b => b.order("aired_on", { ascending: false, nullsFirst: false }).order("created_at", { ascending: false })),
    q("stories", b => b.order("created_at", { ascending: false })),
    q("plans", b => b.order("created_at", { ascending: false })),
    q("resources", b => b.order("created_at", { ascending: false })),
    q("notes", b => b.order("updated_at", { ascending: false })),
    q("contacts", b => b.order("name")),
    q("email_templates", b => b.order("created_at")),
    S.sb.from("staff").select("user_id,name").order("name"),
    S.sb.rpc("push_count")
  ]);
  const [eps, stories, plans, resources, notes, contacts, templates, staff, subs] = res;
  for (const r of [eps, stories, plans, resources, notes, contacts, templates, staff]) if (r.error) throw r.error;
  S.episodes = eps.data || [];
  S.stories = stories.data || [];
  S.plans = plans.data || [];
  S.resources = resources.data || [];
  S.notes = notes.data || [];
  S.contacts = contacts.data || [];
  S.templates = templates.data || [];
  S.staff = staff.data || [];
  S.subs = subs.error ? null : subs.data;
  S.loaded = true;
  S.lastLoad = Date.now();
  setBadge();
}

async function reload(quiet) {
  try {
    await loadAll();
    if (!S.dirty) render(true);
  } catch (e) {
    if (!quiet) toast(errText(e), true);
  }
}

function dateTile(iso) {
  const d = new Date(iso);
  return `<span class="date-tile"><b>${d.getDate()}</b><span>${esc(fmtMonth.format(d).replace(".", ""))}</span></span>`;
}

function planCard(p) {
  const pr = checkProgress(p);
  const pct = pr.all ? Math.round(pr.done / pr.all * 100) : 0;
  const meta = [];
  if (p.air_date) meta.push(`Adás: ${dayDate(p.air_date)}`);
  if (p.shoot_at) meta.push(`Forgatás: ${fmtDateTime.format(new Date(p.shoot_at))}`);
  if (p.owner_id) meta.push(esc(staffName(p.owner_id)));
  return `<li><a class="card" href="#/terv/${p.id}">
    <div class="card-top"><span class="pill s-${p.status}">${PLAN_LABEL[p.status]}</span>${p.episode_id ? `<span class="when">Adás kész</span>` : ""}</div>
    <h3>${esc(p.title)}</h3>
    ${meta.length ? `<p class="meta">${meta.join(" · ")}</p>` : ""}
    ${pr.all ? `<div class="progress"><div class="bar"><span style="width:${pct}%"></span></div>${pr.done}/${pr.all}</div>` : ""}
  </a></li>`;
}

function storyCounts() {
  const c = { aktiv: 0 };
  STORY_STATUSES.forEach(([k]) => { c[k] = 0; });
  S.stories.forEach(s => {
    c[s.status] = (c[s.status] || 0) + 1;
    if (STORY_ACTIVE.includes(s.status)) c.aktiv++;
  });
  return c;
}

function viewStories() {
  const c = storyCounts();
  const filters = [["aktiv", "Aktív"], ...STORY_STATUSES];
  const list = S.stories.filter(s => S.storyFilter === "aktiv" ? STORY_ACTIVE.includes(s.status) : s.status === S.storyFilter);
  const items = list.map(s => `
    <li><a class="card" href="#/sztori/${s.id}">
      <div class="card-top"><span class="pill s-${s.status}">${STORY_LABEL[s.status]}</span><time datetime="${esc(s.created_at)}">${ago(s.created_at)}</time></div>
      <h3>${esc(s.topic)}</h3>
      ${s.details ? `<p class="snip">${esc(s.details)}</p>` : ""}
      <p class="meta">${s.source === "sajat" ? "Saját ötlet" : `${s.kind === "request" ? "Riportkérés" : "Beküldött sztori"}${s.name ? ` · ${esc(s.name)}` : ""}${s.class_name ? ` (${esc(s.class_name)})` : ""}`}${s.plan_id && planById(s.plan_id) ? ` · Tervben` : ""}</p>
    </a></li>`).join("");
  const emptyText = S.storyFilter === "aktiv" ? "Nincs folyamatban lévő sztori. Ha valaki beküld egyet az oldalon, itt jelenik meg." : "Ebben az állapotban nincs sztori.";
  return `<div class="wrap">
    <div class="head"><h1>Sztorik</h1><a class="btn yellow" href="#/sztori/uj">+ Saját ötlet</a></div>
    <div class="chips" role="group" aria-label="Szűrés állapot szerint">${filters.map(([k, l]) => `<button class="chip" type="button" data-filter="${k}" aria-pressed="${S.storyFilter === k}">${l}<span class="n">${c[k] || 0}</span></button>`).join("")}</div>
    ${list.length ? `<ul class="list">${items}</ul>` : `<p class="empty">${emptyText}</p>`}
  </div>`;
}

  return `<div class="wrap">
    <a class="back" href="#/sablonok">← Sablonok</a>
    <div class="head"><h1>${isNew ? "Új sablon" : "Sablon szerkesztése"}</h1></div>
    <form class="form" id="tpl-form" data-id="${isNew ? "" : esc(x.id)}" novalidate>
      <div class="field" id="fw-tname"><label for="f-tname">Sablon neve</label><input id="f-tname" type="text" maxlength="120" autocomplete="off" value="${esc(x.name)}"><p class="err" hidden></p></div>
      <div class="field" id="fw-tsubj"><label for="f-tsubj">Tárgy</label><input id="f-tsubj" type="text" maxlength="300" autocomplete="off" value="${esc(x.subject)}"><p class="err" hidden></p></div>
      <div class="field" id="fw-tbody"><label for="f-tbody">Szöveg</label><textarea class="tall" id="f-tbody" maxlength="10000">${esc(x.body)}</textarea><p class="err" hidden></p>
        <p class="hint">Helyettesíthető mezők: ${Object.keys(PH_LABEL).map(k => `<span class="ph">{{${k}}}</span>`).join(" ")}. A {{alairas}} a te neved lesz, a téma, dátum, időpont, helyszín és link a kiválasztott tervből töltődik ki.</p>
      </div>
      <div class="actions"><button class="btn" type="submit" id="tpl-save">Mentés</button>${isNew ? "" : `<a class="btn ghost" href="#/level?sablon=${x.id}">Levél írása</a>`}<span class="grow"></span>${isNew ? "" : `<button class="btn danger" type="button" data-del-tpl="${esc(x.id)}">Törlés</button>`}</div>
    </form>
  </div>`;
}

function placeholders(t) {
  const set = [];
  `${t.subject}\n${t.body}`.replace(/\{\{\s*(\w+)\s*\}\}/g, (_, k) => { if (!set.includes(k)) set.push(k); });
  return set;
}

function planValues(p) {
  if (!p) return {};
  const v = { tema: p.title };
  if (p.shoot_at) {
    const d = new Date(p.shoot_at);
    v.datum = fmtLongDate.format(d);
    v.idopont = fmtTime.format(d);
  } else if (p.air_date) {
    v.datum = fmtLongDate.format(new Date(p.air_date + "T12:00:00"));
  }
  if (p.location) v.helyszin = p.location;
  if (p.episode_id) v.link = epUrl(p.episode_id);
  return v;
}

  const tpl = S.templates.find(t => t.id === params.get("sablon")) || S.templates[0];

  return `<div class="wrap">
    <a class="back" href="${plan ? `#/terv/${plan.id}` : "#/sablonok"}">← ${plan ? esc(plan.title) : "Sablonok"}</a>
    <div class="head"><h1>E-mail írása</h1></div>
    <form class="form" id="compose" novalidate>
      <div class="field"><label for="m-tpl">Sablon</label><select id="m-tpl">${S.templates.map(t => `<option value="${t.id}" ${t.id === tpl.id ? "selected" : ""}>${esc(t.name)}</option>`).join("")}</select></div>
      <div class="row2">
        <div class="field"><label for="m-contact">Címzett a kapcsolatok közül</label><select id="m-contact"><option value="">Kézzel adom meg</option>${S.contacts.map(c => `<option value="${c.id}" ${contact && contact.id === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select></div>
        <div class="field"><label for="m-to">E-mail-cím</label><input id="m-to" type="email" inputmode="email" autocomplete="off" value="${esc(contact ? contact.email || "" : "")}"></div>
      </div>
      <div class="field"><label for="m-plan">Terv <small>(kitölti a témát, időpontot, helyszínt)</small></label>${planSelect("m-plan", plan ? plan.id : "")}</div>
      <section class="section" id="m-fields"></section>
      <div class="field"><span class="lbl">Előnézet</span><div class="mail-preview" id="m-preview"></div></div>
      <div class="actions"><a class="btn" id="m-open" href="#">Megnyitás levelezőben</a><button class="btn ghost" type="button" data-copy-mail>Szöveg másolása</button></div>
      <p class="hint">A levél a saját levelezőprogramodban nyílik meg; ott még átírhatod, mielőtt elküldöd.</p>

  </div>`;

function wireCompose() {
  const form = document.getElementById("compose");
  if (!form) return;
  const vals = {};
  const tplSel = document.getElementById("m-tpl");
  const cSel = document.getElementById("m-contact");
  const pSel = document.getElementById("m-plan");
  const to = document.getElementById("m-to");
  const fieldsBox = document.getElementById("m-fields");
  const auto = () => {
    const c = S.contacts.find(x => x.id === cSel.value);
    const out = { alairas: S.me, ...planValues(planById(pSel.value)) };
    if (c) out.nev = c.name;
    return out;
  };
  const current = () => S.templates.find(t => t.id === tplSel.value);
  const buildFields = () => {
    const keys = placeholders(current()).filter(k => k !== "alairas");
    const a = auto();
    keys.forEach(k => { if (a[k] !== undefined) vals[k] = a[k]; });
    fieldsBox.hidden = !keys.length;
    fieldsBox.innerHTML = `<h2>Kitöltendő mezők</h2>${keys.map(k => `<div class="field"><label for="ph-${k}">${esc(PH_LABEL[k] || k)}</label><input id="ph-${k}" data-ph="${k}" type="text" autocomplete="off" value="${esc(vals[k] || "")}"></div>`).join("")}`;
    preview();
  };
  const fill = (str, html) => str.replace(/\{\{\s*(\w+)\s*\}\}/g, (_, k) => {
    const v = k === "alairas" ? (vals.alairas || S.me) : vals[k];
    if (v) return html ? esc(v) : v;
    return html ? `<span class="ph">{{${k}}}</span>` : `{{${k}}}`;
  });
  const preview = () => {
    const t = current();
    const subject = fill(t.subject, false);
    const body = fill(t.body, false);
    document.getElementById("m-preview").innerHTML = `<strong>${fill(esc(t.subject), true)}</strong>${fill(esc(t.body), true)}`;
    const addr = to.value.trim();
    document.getElementById("m-open").href = `mailto:${encodeURIComponent(addr).replace(/%40/g, "@")}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    form.dataset.text = `${subject}\n\n${body}`;
  };
  vals.alairas = S.me;
  tplSel.addEventListener("change", buildFields);
  cSel.addEventListener("change", () => {
    const c = S.contacts.find(x => x.id === cSel.value);
    if (c) { to.value = c.email || ""; vals.nev = c.name; }
    buildFields();
  });
  pSel.addEventListener("change", () => {
    Object.assign(vals, planValues(planById(pSel.value)));
    buildFields();
  });
  to.addEventListener("input", preview);
  fieldsBox.addEventListener("input", e => {
    const k = e.target.dataset.ph;
    if (k) { vals[k] = e.target.value; preview(); }
  });
  buildFields();
}

function viewLibrary() {
  const filters = [["osszes", "Összes", ""], ...KINDS];
  const list = S.resources.filter(r => S.resFilter === "osszes" || r.kind === S.resFilter);
  return `<div class="wrap">
    <a class="back" href="#/tobb">← Több</a>
    <div class="head"><h1>Anyagok</h1></div>
    <p class="sub">Minden link egy helyen. Az általános anyagok (intró, outró, logó, zenék) ide kerülnek, az adásokhoz tartozók a tervnél is látszanak.</p>
    <section class="section" id="resources" style="margin-bottom:1rem">${resourcesHtml({}).replace(/<h2>[\s\S]*?<\/h2>[\s\S]*?(?=<div class="resform")/, "<h2>Általános anyag hozzáadása</h2>")}</section>
    <div class="chips" role="group" aria-label="Szűrés típus szerint">${filters.map(([k, l]) => `<button class="chip" type="button" data-rfilter="${k}" aria-pressed="${S.resFilter === k}">${l}</button>`).join("")}</div>
    ${list.length ? `<ul class="list">${list.map(r => resourceItem(r, true)).join("")}</ul>` : `<p class="empty">Nincs anyag ebben a kategóriában.</p>`}
  </div>`;

function missing(text, back) {
  return `<div class="wrap"><a class="back" href="${back}">← Vissza</a><p class="empty" style="margin-top:1rem">${text}</p></div>`;
}

function parseHash() {
  const raw = location.hash.slice(1) || "/";
  const [path, query] = raw.split("?");
  const seg = path.split("/").filter(Boolean).map(s => { try { return decodeURIComponent(s); } catch (e) { return s; } });
  return { seg, params: new URLSearchParams(query || "") };
}

function go(hash) {
  if (location.hash === hash) render();
  else location.hash = hash;
}

function render(quiet) {
  if (!S.user || !S.loaded) return;
  const { seg, params } = parseHash();
  const r = seg[0] || "";
  const id = seg[1] || "";
  let html;
  let nav = "attekintes";
  if (r === "" || r === "attekintes") html = viewOverview();
  else if (r === "tervek") { nav = "tervek"; html = viewPlans(); }
  else if (r === "terv") { nav = "tervek"; html = id === "uj" ? viewPlan(null) : planById(id) ? viewPlan(planById(id)) : missing("Ez a terv nem létezik, vagy törölték.", "#/tervek"); }
  else if (r === "sztorik") { nav = "sztorik"; html = viewStories(); }
  else if (r === "sztori") { nav = "sztorik"; const st = S.stories.find(s => s.id === id); html = id === "uj" ? viewStory(null) : st ? viewStory(st) : missing("Ez a sztori nem létezik, vagy törölték.", "#/sztorik"); }
  else if (r === "adasok") { nav = "adasok"; html = viewEpisodes(); }
  else if (r === "adas") { nav = "adasok"; html = id === "uj" ? viewEpisodeForm(null, planById(params.get("terv"))) : epById(id) ? viewEpisodeForm(epById(id)) : missing("Ez az adás nem létezik, vagy törölték.", "#/adasok"); }
  else if (r === "tobb") { nav = "tobb"; html = viewMore(); }
  else if (r === "jegyzetek") { nav = "tobb"; html = viewNotes(); }
  else if (r === "jegyzet") { nav = "tobb"; const n = S.notes.find(x => x.id === id); html = id === "uj" ? viewNote(null, params.get("terv")) : n ? viewNote(n) : missing("Ez a jegyzet nem létezik, vagy törölték.", "#/jegyzetek"); }
  else if (r === "kapcsolatok") { nav = "tobb"; html = viewContacts(); }
  else if (r === "kapcsolat") { nav = "tobb"; const c = S.contacts.find(x => x.id === id); html = id === "uj" ? viewContact(null) : c ? viewContact(c) : missing("Ez a kapcsolat nem létezik, vagy törölték.", "#/kapcsolatok"); }
  else if (r === "sablonok") { nav = "tobb"; html = viewTemplates(); }
  else if (r === "sablon") { nav = "tobb"; const t = S.templates.find(x => x.id === id); html = id === "uj" ? viewTemplate(null) : t ? viewTemplate(t) : missing("Ez a sablon nem létezik, vagy törölték.", "#/sablonok"); }
  else if (r === "level") { nav = "tobb"; html = viewCompose(params); }
  else if (r === "anyagok") { nav = "tobb"; html = viewLibrary(); }
  else html = viewOverview();
  chrome(true);
  main.innerHTML = html;
  document.querySelectorAll("[data-nav]").forEach(a => {
    if (a.dataset.nav === nav) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
  S.dirty = false;
  wireForms();
  wireCompose();
  if (!quiet) {
    window.scrollTo(0, 0);
    main.focus({ preventScroll: true });
  }
}

function setFieldError(id, message) {
  const wrap = document.getElementById(id);
  if (!wrap) return;
  const err = wrap.querySelector(".err");
  wrap.classList.toggle("bad", !!message);
  if (err) { err.hidden = !message; err.textContent = message || ""; }
}

function busy(btn, on, label) {
  if (!btn) return;
  if (on) { btn.dataset.label = btn.textContent; btn.disabled = true; btn.textContent = label || "Mentés…"; }
  else { btn.disabled = false; btn.textContent = btn.dataset.label || btn.textContent; }
}

function wireForms() {
  document.querySelectorAll("#main form").forEach(f => {
    if (f.id === "compose") return;
    f.addEventListener("input", e => { if (!e.target.closest(".resform, .addrow, .checks")) S.dirty = true; });
    f.addEventListener("change", e => { if (!e.target.closest(".resform, .addrow, .checks")) S.dirty = true; });
  });
  const ep = document.getElementById("ep-form");
  if (ep) {
    const yt = document.getElementById("f-yt");
    const title = document.getElementById("f-title");
    const slug = document.getElementById("f-slug");
    const sum = document.getElementById("f-sum");
    const pub = document.getElementById("f-pub");
    const notifyRow = document.getElementById("notify-row");
    let slugTouched = false;
    const updSlug = () => {
      if (!slug) return;
      if (!slugTouched) {
        slug.value = uniqueSlug(slugify(title.value));
        if (slug.value) setFieldError("fw-slug", "");
      }
      document.getElementById("slug-url").textContent = slug.value ? epUrl(slug.value) : "";
    };
    const updSum = () => { document.getElementById("sum-count").textContent = `${sum.value.length}/600`; };
    const updPreview = () => {
      const id = ytId(yt.value);
      document.getElementById("yt-preview").innerHTML = id ? epThumb({ youtube_id: id }) : "";
    };
    const updNotify = () => { if (notifyRow) notifyRow.hidden = !pub.checked; };
    yt.addEventListener("input", () => { updPreview(); setFieldError("fw-yt", ""); });
    title.addEventListener("input", () => { updSlug(); setFieldError("fw-title", ""); });
    if (slug) slug.addEventListener("input", () => { slugTouched = true; updSlug(); setFieldError("fw-slug", ""); });
    sum.addEventListener("input", updSum);
    pub.addEventListener("change", updNotify);
    updSlug(); updSum(); updNotify();
    ep.addEventListener("submit", e => { e.preventDefault(); saveEpisode(ep); });
  }
  const bind = (id, fn) => { const f = document.getElementById(id); if (f) f.addEventListener("submit", e => { e.preventDefault(); fn(f); }); };
  bind("story-form", saveStory);
  bind("plan-form", savePlan);
  bind("note-form", saveNote);
  bind("contact-form", saveContact);
  bind("tpl-form", saveTemplate);
  const cq = document.getElementById("c-q");
  if (cq) cq.addEventListener("input", () => {
    S.contactQ = cq.value;
    const q = cq.value.trim().toLocaleLowerCase("hu");
    document.getElementById("contact-list").innerHTML = contactListHtml(S.contacts.filter(c => !q || `${c.name} ${c.role || ""} ${c.email || ""}`.toLocaleLowerCase("hu").includes(q)));
  });
  const ckNew = document.getElementById("ck-new");
  if (ckNew) ckNew.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); addCheck(); } });
  const rsUrl = document.getElementById("rs-url");
  if (rsUrl) rsUrl.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); addResource(); } });
}

function uniqueSlug(base) {
  if (!base) return "";
  let s = base;
  let n = 2;
  while (S.episodes.some(e => e.id === s)) s = `${base}-${n++}`.slice(0, 80);
  return s;
}

const val = id => (document.getElementById(id)?.value || "").trim();

async function savePlan(form) {
  const isNew = !form.dataset.id;
  const title = val("f-ptitle");
  setFieldError("fw-ptitle", title ? "" : "Adj címet a tervnek.");
  if (!title) { document.getElementById("f-ptitle").focus(); return; }
  const row = {
    title,
    status: form.querySelector('input[name="status"]:checked')?.value || "otlet",
    air_date: val("f-air") || null,
    shoot_at: fromLocalInput(val("f-shoot")),
    location: val("f-loc") || null,
    owner_id: val("f-owner") || null,
    outline: document.getElementById("f-outline").value || null
  };
  if (isNew) row.checklist = document.getElementById("f-defcheck").checked ? DEFAULT_CHECKLIST.map(t => ({ id: uid(), t, done: false })) : [];
  const btn = document.getElementById("plan-save");
  busy(btn, true);
  try {
    const saved = isNew ? await dbInsert("plans", row) : await dbUpdate("plans", form.dataset.id, row);
    replaceIn(S.plans, saved);
    S.dirty = false;
    toast(isNew ? "Terv létrehozva." : "Mentve.");
    go(`#/terv/${saved.id}`);
  } catch (e) {
    busy(btn, false);
    toast(errText(e), true);
  }
}

function currentPlan() {
  const f = document.getElementById("plan-form");
  return f && f.dataset.id ? planById(f.dataset.id) : null;
}

async function saveChecklist(p, list) {
  const prev = p.checklist;
  p.checklist = list;
  const box = document.getElementById("checklist");
  if (box) box.innerHTML = checklistHtml(p);
  const ckNew = document.getElementById("ck-new");
  if (ckNew) ckNew.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); addCheck(); } });
  try {
    const saved = await dbUpdate("plans", p.id, { checklist: list });
    p.updated_at = saved.updated_at;
  } catch (e) {
    p.checklist = prev;
    if (box) box.innerHTML = checklistHtml(p);
    toast(errText(e), true);
  }
}

function addCheck() {
  const p = currentPlan();
  const input = document.getElementById("ck-new");
  const t = input.value.trim();
  if (!p || !t) { input.focus(); return; }
  saveChecklist(p, [...(p.checklist || []), { id: uid(), t: t.slice(0, 200), done: false }]).then(() => document.getElementById("ck-new")?.focus());
}

async function addResource() {
  const box = document.querySelector(".resform");
  if (!box) return;
  const scope = JSON.parse(box.dataset.resScope || "{}");
  const label = val("rs-label");
  const url = val("rs-url");
  if (!label && !url) { document.getElementById("rs-label").focus(); return; }
  const row = { kind: val("rs-kind") || "egyeb", label: label || url.replace(/^https?:\/\//, "").slice(0, 160), url: url || null, plan_id: scope.plan_id || null, episode_id: scope.episode_id || null };
  try {
    const saved = await dbInsert("resources", row);
    S.resources.unshift(saved);
    toast("Anyag hozzáadva.");
    refreshResources(scope);
  } catch (e) {
    toast(errText(e), true);
  }
}

function refreshResources(scope) {
  if (location.hash.startsWith("#/anyagok")) { const keep = S.dirty; render(true); S.dirty = keep; return; }
  const sec = document.getElementById("resources");
  if (sec) sec.innerHTML = resourcesHtml(scope);
  const rsUrl = document.getElementById("rs-url");
  if (rsUrl) rsUrl.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); addResource(); } });
}

async function deleteResource(id) {
  const r = S.resources.find(x => x.id === id);
  if (!r || !confirm(`Törlöd ezt az anyagot a listából?\n\n${r.label}\n\nMagát a fájlt nem törli.`)) return;
  try {
    await dbDelete("resources", id);
    removeFrom(S.resources, id);
    refreshResources(r.plan_id ? { plan_id: r.plan_id } : r.episode_id ? { episode_id: r.episode_id } : {});
  } catch (e) { toast(errText(e), true); }
}

async function deletePlan(id) {
  const p = planById(id);
  if (!p || !confirm(`Biztosan törlöd ezt a tervet?\n\n${p.title}\n\nA teendőlista, a forgatókönyv és a hozzá tartozó anyaglinkek is törlődnek. A jegyzetek és sztorik megmaradnak.`)) return;
  try {
    await dbDelete("plans", id);
    toast("Terv törölve.");
    S.dirty = false;
    await reload(true);
    go("#/tervek");
  } catch (e) { toast(errText(e), true); }
}

async function storyToPlan(storyId) {
  const s = S.stories.find(x => x.id === storyId);
  if (!s) return;
  const lines = [];
  if (s.details) lines.push(s.details);
  if (s.name || s.contact) lines.push("", `Beküldő: ${[s.name, s.class_name, s.contact].filter(Boolean).join(", ")}`);
  if (s.link) lines.push(`Link: ${s.link}`);
  try {
    const plan = await dbInsert("plans", { title: s.topic.slice(0, 160), status: "otlet", owner_id: S.user.id, outline: lines.join("\n") || null, checklist: DEFAULT_CHECKLIST.map(t => ({ id: uid(), t, done: false })) });
    S.plans.unshift(plan);
    const upd = await dbUpdate("stories", s.id, { plan_id: plan.id, status: s.status === "beerkezett" ? "otlet" : s.status });
    replaceIn(S.stories, upd);
    setBadge();
    if (s.link && safeHref(s.link)) {
      const r = await dbInsert("resources", { plan_id: plan.id, kind: "egyeb", label: "Beküldött link", url: s.link });
      S.resources.unshift(r);
    }
    toast("Terv létrehozva a sztoriból.");
    go(`#/terv/${plan.id}`);
  } catch (e) { toast(errText(e), true); }
}

async function saveEpisode(form) {
  const isNew = !form.dataset.id;
  const youtube_id = ytId(val("f-yt"));
  const title = val("f-title");
  const id = isNew ? val("f-slug") : form.dataset.id;
  setFieldError("fw-yt", youtube_id ? "" : "Másold be a videó YouTube-linkjét.");
  setFieldError("fw-title", title ? "" : "Adj címet az adásnak.");
  if (isNew) setFieldError("fw-slug", /^[a-z0-9]+([-_][a-z0-9]+)*$/.test(id) ? "" : "Csak kisbetű, szám, kötőjel és alulvonás lehet benne.");
  const bad = form.querySelector(".field.bad input");
  if (bad) { bad.focus(); return; }
  const published = document.getElementById("f-pub").checked;
  const notify = !!document.getElementById("f-notify")?.checked && published;
  const row = { title, youtube_id, aired_on: val("f-date") || null, category: val("f-cat") || null, summary: val("f-sum") || null, published };
  const btn = document.getElementById("ep-save");
  busy(btn, true);
  const res = isNew ? await S.sb.from("episodes").insert({ id, ...row }) : await S.sb.from("episodes").update(row).eq("id", id);
  if (res.error) {
    busy(btn, false);
    if (res.error.code === "23505") { setFieldError("fw-slug", errText(res.error)); document.getElementById("f-slug").focus(); }
    else toast(errText(res.error), true);
    return;
  }
  const planId = form.dataset.plan;
  if (isNew && planId) {
    try {
      await dbUpdate("plans", planId, { episode_id: id, status: "megjelent" });
      await S.sb.from("resources").update({ episode_id: id }).eq("plan_id", planId).is("episode_id", null);
    } catch (e) {}
  }
  S.dirty = false;
  toast(isNew ? "Adás elmentve." : "Változások elmentve.");
  if (notify) await sendNotification(id, true);
  await reload(true);
  go(isNew ? (planId ? `#/terv/${planId}` : "#/adasok") : `#/adas/${encodeURIComponent(id)}`);
}

async function sendNotification(id, silentConfirm) {
  const ep = epById(id);
  if (!silentConfirm && ep && ep.notified_at && !confirm("Erről az adásról már ment ki értesítés. Biztosan újra elküldöd mindenkinek?")) return;
  const btn = document.querySelector(`[data-notify="${CSS.escape(id)}"]`);
  if (btn) { btn.disabled = true; btn.textContent = "Küldés…"; }
  try {
    const { data, error } = await S.sb.functions.invoke("notify-episode", { body: { episodeId: id } });
    if (error) {
      const status = error.context && error.context.status;
      let detail = "";
      try {
        const text = await error.context.text();
        try { detail = JSON.parse(text).error || text; } catch (e) { detail = text; }
      } catch (e) {}
      if (status === 404) throw new Error("Az értesítő funkció nincs telepítve a Supabase-ben.");
      if (!status) throw new Error("Nem sikerült elérni az értesítő funkciót. Ellenőrizd az internetet.");
      throw new Error(detail || `Hiba (${status})`);
    }
    toast(data.sent ? `Értesítés elküldve ${data.sent} eszközre.` : "Még nincs feliratkozott eszköz, így senki nem kapott értesítést.");
  } catch (e) {
    toast(`Az értesítés nem ment ki: ${String(e.message || e)}`, true);
  }
  if (btn) { btn.disabled = false; btn.textContent = "Értesítés újraküldése"; }
  if (!silentConfirm) reload(true);
}

async function deleteEpisode(id) {
  const ep = epById(id);
  if (!confirm(`Biztosan törlöd ezt az adást?\n\n${ep ? ep.title : id}\n\nAz oldalról is eltűnik. A YouTube-videót nem törli.`)) return;
  const { error } = await S.sb.from("episodes").delete().eq("id", id);
  if (error) { toast(errText(error), true); return; }
  toast("Adás törölve.");
  S.dirty = false;
  await reload(true);
  go("#/adasok");
}

async function saveStory(form) {
  const isNew = !form.dataset.id;
  const own = form.dataset.own === "true";
  const row = {
    status: form.querySelector('input[name="status"]:checked')?.value || "otlet",
    note: val("f-note") || null,
    episode_id: val("f-ep") || null
  };
  if (own) {
    row.topic = val("f-topic");
    row.details = val("f-details") || null;
    row.link = val("f-link") || null;
    setFieldError("fw-topic", row.topic ? "" : "Írd le röviden, miről szól.");
    if (!row.topic) { document.getElementById("f-topic").focus(); return; }
  }
  const btn = document.getElementById("story-save");
  busy(btn, true);
  try {
    const saved = isNew ? await dbInsert("stories", { ...row, source: "sajat", kind: "story" }) : await dbUpdate("stories", form.dataset.id, row);
    replaceIn(S.stories, saved);
    setBadge();
    S.dirty = false;
    toast(isNew ? "Ötlet elmentve." : "Mentve.");
    go("#/sztorik");
  } catch (e) {
    busy(btn, false);
    toast(errText(e), true);
  }
}

async function deleteStory(id) {
  const st = S.stories.find(s => s.id === id);
  if (!confirm(`Biztosan törlöd ezt a sztorit?\n\n${st ? st.topic : ""}\n\nEzt nem lehet visszavonni.`)) return;
  try {
    await dbDelete("stories", id);
    removeFrom(S.stories, id);
    setBadge();
    toast("Sztori törölve.");
    S.dirty = false;
    go("#/sztorik");
  } catch (e) { toast(errText(e), true); }
}

async function saveNote(form) {
  const isNew = !form.dataset.id;
  const title = val("f-ntitle");
  setFieldError("fw-ntitle", title ? "" : "Adj címet a jegyzetnek.");
  if (!title) { document.getElementById("f-ntitle").focus(); return; }
  const row = { title, body: document.getElementById("f-nbody").value || null, plan_id: val("f-nplan") || null, pinned: document.getElementById("f-npin").checked };
  const btn = document.getElementById("note-save");
  busy(btn, true);
  try {
    const saved = isNew ? await dbInsert("notes", row) : await dbUpdate("notes", form.dataset.id, row);
    replaceIn(S.notes, saved);
    S.dirty = false;
    toast("Jegyzet mentve.");
    go(isNew && saved.plan_id ? `#/terv/${saved.plan_id}` : "#/jegyzetek");
  } catch (e) {
    busy(btn, false);
    toast(errText(e), true);
  }
}

async function deleteRow(table, list, id, message, back) {
  if (!confirm(message)) return;
  try {
    await dbDelete(table, id);
    removeFrom(list, id);
    S.dirty = false;
    toast("Törölve.");
    go(back);
  } catch (e) { toast(errText(e), true); }
}

async function saveContact(form) {
  const isNew = !form.dataset.id;
  const name = val("f-cname");
  const email = val("f-cemail");
  setFieldError("fw-cname", name ? "" : "Add meg a nevet.");
  setFieldError("fw-cemail", !email || isEmail(email) ? "" : "Ez nem tűnik érvényes e-mail-címnek.");
  const bad = form.querySelector(".field.bad input");
  if (bad) { bad.focus(); return; }
  const row = { name, role: val("f-crole") || null, email: email || null, phone: val("f-cphone") || null, note: val("f-cnote") || null };
  const btn = document.getElementById("contact-save");
  busy(btn, true);
  try {
    const saved = isNew ? await dbInsert("contacts", row) : await dbUpdate("contacts", form.dataset.id, row);
    replaceIn(S.contacts, saved);
    S.contacts.sort((a, b) => a.name.localeCompare(b.name, "hu"));
    S.dirty = false;
    toast("Kapcsolat mentve.");
    go(`#/kapcsolat/${saved.id}`);
  } catch (e) {
    busy(btn, false);
    toast(errText(e), true);
  }
}

async function saveTemplate(form) {
  const isNew = !form.dataset.id;
  const row = { name: val("f-tname"), subject: val("f-tsubj"), body: document.getElementById("f-tbody").value.trim() };
  setFieldError("fw-tname", row.name ? "" : "Adj nevet a sablonnak.");
  setFieldError("fw-tsubj", row.subject ? "" : "Add meg a levél tárgyát.");
  setFieldError("fw-tbody", row.body ? "" : "Írd meg a levél szövegét.");
  const bad = form.querySelector(".field.bad input, .field.bad textarea");
  if (bad) { bad.focus(); return; }
  const btn = document.getElementById("tpl-save");
  busy(btn, true);
  try {
    const saved = isNew ? await dbInsert("email_templates", row) : await dbUpdate("email_templates", form.dataset.id, row);
    replaceIn(S.templates, saved);
    if (isNew) { S.templates.splice(S.templates.indexOf(saved), 1); S.templates.push(saved); }
    S.dirty = false;
    toast("Sablon mentve.");
    go("#/sablonok");
  } catch (e) {
    busy(btn, false);
    toast(errText(e), true);
  }
}

async function copyText(text, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
    const t = document.createElement("textarea");
    t.value = text; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    try { ok = document.execCommand("copy"); } catch (e2) {}
    t.remove();
  }
  toast(ok ? "Kimásolva." : "Nem sikerült a másolás.", !ok);
}

async function enter(user) {
  S.user = user;
  const { data: ok, error } = await S.sb.rpc("is_staff");
  if (error) { viewLogin(errText(error)); return; }
  if (!ok) { viewNotStaff(); return; }
  try {
    await loadAll();
  } catch (e) {
    chrome(false);
    main.innerHTML = `<div class="wrap center"><div class="login"><h1>Nem sikerült betölteni</h1><p class="msg">${esc(errText(e))}</p><button class="btn" type="button" data-retry>Újra</button></div></div>`;
    return;
  }
  S.me = staffName(user.id) || user.email;
  document.getElementById("who").textContent = S.me;
  render();
}

async function login(form) {
  const email = form.querySelector("#l-email").value.trim();
  const password = form.querySelector("#l-pass").value;
  if (!email || !password) { viewLogin("Add meg az e-mail-címed és a jelszavad."); return; }
  const btn = form.querySelector("#l-btn");
  busy(btn, true, "Belépés…");
  const { data, error } = await S.sb.auth.signInWithPassword({ email, password });
  if (error) { viewLogin(errText(error)); document.getElementById("l-email").value = email; return; }
  await enter(data.user);
}

async function logout() {
  await S.sb.auth.signOut();
  Object.assign(S, { user: null, loaded: false, episodes: [], stories: [], plans: [], resources: [], notes: [], contacts: [], templates: [] });
  viewLogin();
}

document.addEventListener("submit", e => {
  if (e.target.id === "login-form") { e.preventDefault(); login(e.target); }
});

document.addEventListener("click", e => {
  const t = e.target;
  const on = sel => t.closest(sel);
  let el;
  if (on("[data-logout]")) { logout(); return; }
  if (on("[data-retry]")) { location.reload(); return; }
  if ((el = on("[data-filter]"))) { S.storyFilter = el.dataset.filter; render(true); return; }
  if ((el = on("[data-pfilter]"))) { S.planFilter = el.dataset.pfilter; render(true); return; }
  if ((el = on("[data-rfilter]"))) { S.resFilter = el.dataset.rfilter; render(true); return; }
  if ((el = on("[data-notify]"))) { sendNotification(el.dataset.notify, false); return; }
  if ((el = on("[data-del-ep]"))) { deleteEpisode(el.dataset.delEp); return; }
  if ((el = on("[data-del-story]"))) { deleteStory(el.dataset.delStory); return; }
  if ((el = on("[data-del-plan]"))) { deletePlan(el.dataset.delPlan); return; }
  if ((el = on("[data-story-plan]"))) { el.disabled = true; storyToPlan(el.dataset.storyPlan); return; }
  if ((el = on("[data-del-note]"))) { const n = S.notes.find(x => x.id === el.dataset.delNote); deleteRow("notes", S.notes, el.dataset.delNote, `Biztosan törlöd ezt a jegyzetet?\n\n${n ? n.title : ""}`, "#/jegyzetek"); return; }
  if ((el = on("[data-del-contact]"))) { const c = S.contacts.find(x => x.id === el.dataset.delContact); deleteRow("contacts", S.contacts, el.dataset.delContact, `Biztosan törlöd ezt a kapcsolatot?\n\n${c ? c.name : ""}`, "#/kapcsolatok"); return; }
  if ((el = on("[data-del-tpl]"))) { const x = S.templates.find(y => y.id === el.dataset.delTpl); deleteRow("email_templates", S.templates, el.dataset.delTpl, `Biztosan törlöd ezt a sablont?\n\n${x ? x.name : ""}`, "#/sablonok"); return; }
  if (on("[data-check-add]")) { addCheck(); return; }
  if ((el = on("[data-uncheck-del]"))) {
    const p = currentPlan();
    if (p) saveChecklist(p, p.checklist.filter((_, i) => i !== Number(el.dataset.uncheckDel)));
    return;
  }
  if (on("[data-res-add]")) { addResource(); return; }
  if ((el = on("[data-res-del]"))) { deleteResource(el.dataset.resDel); return; }
  if ((el = on("[data-copy-mail]"))) { copyText(document.getElementById("compose").dataset.text || "", el); return; }
  if ((el = on("#m-open"))) {
    if (!document.getElementById("m-to").value.trim()) { e.preventDefault(); toast("Add meg a címzett e-mail-címét.", true); document.getElementById("m-to").focus(); }
    return;
  }
});

document.addEventListener("change", async e => {
  const t = e.target;
  if (t.matches("[data-check]")) {
    const p = currentPlan();
    if (!p) return;
    const i = Number(t.dataset.check);
    saveChecklist(p, p.checklist.map((c, j) => j === i ? { ...c, done: t.checked } : c));
    return;
  }
  if (t.matches("[data-ov-check]")) {
    const p = planById(t.dataset.ovCheck);
    if (!p) return;
    const i = Number(t.dataset.i);
    const list = p.checklist.map((c, j) => j === i ? { ...c, done: t.checked } : c);
    const prev = p.checklist;
    p.checklist = list;
    t.closest(".check").classList.toggle("done", t.checked);
    try { await dbUpdate("plans", p.id, { checklist: list }); toast("Kipipálva."); }
    catch (err) { p.checklist = prev; t.checked = !t.checked; toast(errText(err), true); }
  }
});

window.addEventListener("hashchange", () => render());

document.addEventListener("error", e => {
  if (e.target instanceof HTMLImageElement && e.target.closest(".thumb")) e.target.remove();
}, true);

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && S.loaded && Date.now() - S.lastLoad > 30000) reload(true);
});

async function start() {
  if (!CFG.supabaseUrl || !CFG.supabaseKey) { viewSetup(); return; }
  if (!window.supabase) {
    main.innerHTML = `<div class="wrap center"><div class="login"><h1>Nem sikerült betölteni</h1><p>Ellenőrizd az internetkapcsolatot, majd próbáld újra.</p><button class="btn" type="button" data-retry>Újra</button></div></div>`;
    return;
  }
  S.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true } });
  const { data } = await S.sb.auth.getSession();
  if (data.session) await enter(data.session.user);
  else viewLogin();
}

start();
</script>
