<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#080F2B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tények++">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Tények++, a Creascola diákhíradója</title>
<meta name="description" content="Tények++: a Creascola diákhíradója. Nézd meg a legfrissebb adást, böngészd a korábbiakat, vagy küldj sztorit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --font:"Archivo","Helvetica Neue",Arial,system-ui,sans-serif;
  --bg:#080F2B;
  --surface:#111A42;
  --ink:#EEF1FC;
  --muted:#A4AED0;
  --line:#27336B;
  --brand:#3C57F5;
  --on-brand:#FFFFFF;
  --link:#9DACFF;
  --strap:#FFD21F;
  --on-strap:#0B1533;
  --band:#2440E6;
  --on-band:#FFFFFF;
  --slate-a:#2B48F0;
  --slate-b:#101C5C;
  --danger:#FF8A93;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100%;
  display:flex;
  flex-direction:column;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font);
  font-size:1.0625rem;
  line-height:1.55;
}
img{max-width:100%}
a{color:var(--link)}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:3px solid var(--link);outline-offset:3px;border-radius:4px}
main{flex:1}
main:focus{outline:none}
.wrap{width:100%;max-width:72rem;margin-inline:auto;padding-inline:clamp(1rem,4vw,2.5rem)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.skip{position:absolute;left:1rem;top:-4rem;background:var(--strap);color:var(--on-strap);padding:.6rem .9rem;border-radius:8px;font-weight:700;z-index:10}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + .5rem)}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem 1.5rem;padding-block:1rem}
.logo{display:inline-flex;align-items:center;gap:.16em;font-weight:900;font-stretch:125%;font-size:1.65rem;letter-spacing:-.02em;line-height:1;color:var(--ink);text-decoration:none;min-height:44px}
.logo b{background:var(--strap);color:var(--on-strap);padding:.06em .2em .1em;border-radius:5px;font-weight:900;letter-spacing:0}
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:.15rem;margin-inline:-.65rem 0}
.nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 .65rem;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:600}
.nav a:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.nav a[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--strap)}
.nav a.cta{background:var(--brand);color:var(--on-brand);margin-left:.5rem;padding:0 .95rem;font-weight:700}
.nav a.cta:hover{background:color-mix(in srgb,var(--brand) 86%,#000)}
.nav a.cta[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--strap)}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:.7rem 1.25rem;border:0;border-radius:10px;background:var(--brand);color:var(--on-brand);font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.btn:hover{background:color-mix(in srgb,var(--brand) 86%,#000)}
.btn.ink{background:#0B1533;color:#FFFFFF}
.btn.ink:hover{background:#1B2A66}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}

.screen{position:relative;display:block;container-type:inline-size;aspect-ratio:16/9;border-radius:14px;overflow:hidden;isolation:isolate;background:linear-gradient(135deg,var(--slate-a),var(--slate-b));color:#FFFFFF;text-decoration:none}
.screen::after{content:"++";position:absolute;right:-.03em;bottom:-.2em;z-index:-1;font-family:var(--font);font-weight:900;font-stretch:125%;font-size:54cqw;line-height:1;color:transparent;-webkit-text-stroke:.012em rgba(255,255,255,.2)}
.screen .thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.screen .no{position:absolute;left:3.5cqw;top:3.5cqw;z-index:1;padding:.2em .7em;border-radius:999px;background:rgba(11,21,51,.72);font-weight:700;font-size:clamp(.78rem,3.3cqw,1rem);line-height:1.5}
.play{position:absolute;inset:0;display:grid;place-items:center;width:100%;height:100%;padding:0;border:0;background:none;color:inherit;cursor:pointer}
.disc{display:grid;place-items:center;width:clamp(3.25rem,15cqw,5.75rem);aspect-ratio:1;border-radius:50%;background:#FFFFFF;box-shadow:0 12px 32px rgba(6,12,45,.4);transition:transform .15s ease}
.disc svg{width:36%;margin-left:7%;fill:#0B1533}
button.play:hover .disc,a.screen:hover .disc{transform:scale(1.07)}
button.play:focus-visible{outline:none}
button.play:focus-visible .disc{outline:4px solid var(--strap);outline-offset:4px}
.soon{position:absolute;inset:0;display:grid;place-items:center;padding:1rem;text-align:center;font-weight:700;font-size:clamp(.85rem,4cqw,1.2rem)}
.soon span{padding:.35em .9em;border-radius:999px;background:rgba(11,21,51,.72)}
.blocked{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:.85rem;padding:1rem;text-align:center;font-weight:700}
.blocked .btn{background:#FFFFFF;color:#0B1533}
.blocked .btn:hover{background:#E6EAFA}

.strap-row{display:flex;flex-wrap:wrap;align-items:stretch;font-size:.9rem;font-weight:700;line-height:1.3}
.strap{background:var(--strap);color:var(--on-strap);padding:.4rem .75rem}
.strap-date{background:var(--surface);color:var(--ink);padding:.4rem .75rem;font-weight:600}

.home{display:grid;gap:2.75rem;padding-block:.5rem 3.5rem}
.chyron{position:relative;z-index:2;width:fit-content;max-width:min(46rem,calc(100% - .6rem));margin:-2.25rem 0 0 .6rem;transition:margin .35s ease}
.chyron .strap-row{box-shadow:0 6px 18px rgba(6,12,45,.18);width:fit-content}
.band{background:var(--band);color:var(--on-band);padding:.8rem 1rem .95rem;box-shadow:0 10px 28px rgba(6,12,45,.25)}
.band h1{font-size:clamp(1.45rem,4.4vw,2.7rem);font-weight:800;font-stretch:112%;line-height:1.08;letter-spacing:-.012em}
.band a{color:inherit;text-decoration:none}
.band a:hover{text-decoration:underline;text-decoration-thickness:.08em;text-underline-offset:.14em}
.hero.is-playing .chyron{margin:.9rem 0 0 0}
.lead{max-width:62ch;margin-top:1.25rem;font-size:1.15rem}
.textlink{display:inline-flex;align-items:center;min-height:44px;margin-top:.35rem;font-weight:700}
.textlink.solo{margin-top:.9rem}

.rundown h2{font-size:1.2rem;font-weight:800;font-stretch:112%;margin-bottom:.6rem}
.rows{list-style:none;margin:0 0 1.25rem;padding:0;border-top:3px solid var(--ink)}
.row{display:grid;grid-template-columns:2.4rem 1fr;gap:.85rem;padding:.9rem 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.row-no{font-weight:900;font-stretch:125%;font-size:1.55rem;line-height:1.1;color:var(--link)}
.row-title{display:block;font-weight:700;line-height:1.25}
.row:hover .row-title{text-decoration:underline;text-underline-offset:.15em}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin-top:.4rem;font-size:.875rem;color:var(--muted)}
.cat{padding:.05rem .6rem;border:1.5px solid var(--line);border-radius:999px;color:var(--ink);font-weight:600}

.tipband{background:var(--strap);color:#0B1533}
.tipband .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1.25rem 2rem;padding-block:2.25rem}
.tipband h2{font-size:clamp(1.5rem,4.5vw,2.4rem);font-weight:900;font-stretch:118%;line-height:1.08;letter-spacing:-.015em}
.tipband p{max-width:44ch;margin-top:.5rem;font-weight:500}

.page{padding-block:1.5rem 4rem}
.page-title{font-size:clamp(2.2rem,7.5vw,4.25rem);font-weight:900;font-stretch:125%;line-height:1;letter-spacing:-.025em}
.page-sub{max-width:56ch;margin-top:.9rem;font-size:1.15rem;color:var(--muted)}

.controls{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem 1rem;margin-block:1.75rem .75rem}
.controls .search{flex:1 1 17rem;max-width:26rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{min-height:44px;padding:0 1rem;border:1.5px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.count{margin-bottom:1.25rem;font-size:.9rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,18.5rem),1fr));gap:2.25rem 1.5rem;list-style:none;margin:0;padding:0}
.item a{display:block;color:inherit;text-decoration:none}
.item h2{margin-top:.4rem;font-size:1.25rem;font-weight:800;line-height:1.2}
.item a:hover h2{text-decoration:underline;text-underline-offset:.15em}
.item .meta{margin-top:.8rem}
.item .screen+h2{margin-top:.8rem}
.empty{padding:2rem 1.25rem;border:1.5px dashed var(--line);border-radius:14px;color:var(--muted)}

.episode{max-width:54rem}
.back{display:inline-flex;align-items:center;min-height:44px;margin-bottom:.5rem;font-weight:700}
.episode .strap-row{margin-top:1.25rem}
.episode h1{margin-top:.9rem;font-size:clamp(1.75rem,5.2vw,3rem);font-weight:800;font-stretch:112%;line-height:1.08;letter-spacing:-.015em}
.episode .screen+h1{margin-top:1.4rem}
.pager{display:grid;gap:.75rem;margin-top:2.5rem;padding-top:1.25rem;border-top:3px solid var(--ink)}
@media (min-width:40rem){.pager{grid-template-columns:1fr 1fr}.pager .next{text-align:right}}
.pager a{display:block;padding:.6rem 0;color:inherit;text-decoration:none}
.pager small{display:block;font-size:.875rem;color:var(--muted)}
.pager strong{display:block;line-height:1.25}
.pager a:hover strong{text-decoration:underline;text-underline-offset:.15em}

.people{display:grid;gap:1.25rem;margin-top:2.5rem}
@media (min-width:62rem){.people{grid-template-columns:1fr 1fr}}
.person{display:grid;gap:1.25rem;align-content:start;padding:clamp(1.1rem,3vw,1.75rem);border-radius:18px;background:var(--surface);border:1px solid var(--line)}
@media (min-width:34rem){.person{grid-template-columns:7.5rem 1fr;gap:1.5rem}}
.mono{position:relative;display:grid;place-items:center;container-type:inline-size;width:7.5rem;aspect-ratio:1;border-radius:14px;overflow:hidden;isolation:isolate;background:linear-gradient(135deg,var(--slate-a),var(--slate-b));color:#FFFFFF;font-weight:900;font-stretch:125%;font-size:2.6rem;letter-spacing:-.03em}
.mono::after{content:"++";position:absolute;right:-.02em;bottom:-.22em;z-index:-1;font-size:80cqw;line-height:1;color:transparent;-webkit-text-stroke:.012em rgba(255,255,255,.2)}
.person h2{font-size:clamp(1.6rem,4.5vw,2.1rem);font-weight:900;font-stretch:118%;line-height:1.05;letter-spacing:-.02em}
.role{margin-top:.4rem;font-weight:700;color:var(--link)}
.person .bio{max-width:52ch;margin-top:.9rem}
.actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.25rem}

.tip{display:grid;gap:2.5rem;margin-top:2rem}
@media (min-width:58rem){.tip{grid-template-columns:minmax(0,1.5fr) minmax(16rem,1fr);gap:3.5rem;align-items:start}}
.form{display:grid;gap:1.15rem}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:.35rem;margin:0;padding:.3rem;border:1.5px solid var(--line);border-radius:14px;background:var(--surface)}
.seg label{position:relative;display:block}
.seg input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.seg span{display:grid;place-items:center;min-height:46px;padding:.4rem .5rem;border-radius:10px;text-align:center;font-weight:700;line-height:1.2}
.seg input:checked+span{background:var(--brand);color:var(--on-brand)}
.seg input:focus-visible+span{outline:3px solid var(--link);outline-offset:2px}
.field label{display:block;margin-bottom:.35rem;font-weight:700}
.field label small{font-weight:500;font-size:.875rem;color:var(--muted)}
input[type="text"],input[type="search"],input[type="url"],input[type="email"],textarea{width:100%;padding:.75rem .9rem;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
textarea{min-height:9.5rem;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
input:focus-visible,textarea:focus-visible{outline:3px solid var(--link);outline-offset:1px;border-color:var(--link)}
.field.bad input,.field.bad textarea{border-color:var(--danger)}
.err{margin-top:.35rem;font-size:.9rem;font-weight:600;color:var(--danger)}
.hint{font-size:.9rem;color:var(--muted)}
.status{padding:1rem 1.1rem;border-left:5px solid var(--strap);border-radius:0 10px 10px 0;background:var(--surface)}
.side{padding:1.4rem;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.side h2{font-size:1.2rem;font-weight:800;font-stretch:112%}
.side p{margin-top:.5rem}
.side .mail{display:inline-block;margin-top:.75rem;font-weight:700;overflow-wrap:anywhere}

.appcard{display:grid;gap:1rem 2rem;align-items:center;margin-bottom:3.25rem;padding:clamp(1.1rem,3vw,1.6rem);border-radius:18px;background:var(--surface);border:1px solid var(--line)}
@media (min-width:46rem){.appcard{grid-template-columns:auto 1fr auto}}
.bell{display:grid;place-items:center;width:3.25rem;height:3.25rem;border-radius:14px;background:var(--strap);color:var(--on-strap)}
.bell svg{width:1.6rem;height:1.6rem}
.appcard h2{font-size:1.3rem;font-weight:800;font-stretch:112%;line-height:1.15}
.appcard p{margin-top:.3rem;color:var(--muted)}
.appcard .actions{margin-top:0}
.appmsg{grid-column:1/-1;font-weight:600;color:var(--ink) !important}
.loading{padding-block:4rem;color:var(--muted);font-weight:600}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.done{display:grid;gap:.75rem;justify-items:start;padding:clamp(1.2rem,3vw,1.75rem);border-radius:16px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--strap)}
.done h2{font-size:1.6rem;font-weight:900;font-stretch:118%;line-height:1.1}
.done:focus{outline:none}
.btn[disabled]{opacity:.65;cursor:progress}
.notice{background:var(--strap);color:#0B1533}
.notice .wrap{display:flex;align-items:center;gap:.75rem;padding-block:.55rem;font-size:.95rem;font-weight:600;line-height:1.35}
.notice svg{flex:none;width:1.25rem;height:1.25rem}
.notice p{flex:1}
.notice strong{font-weight:800}
.notice.done{background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line)}
.notice.done svg{color:var(--strap)}
.notice-x{display:grid;place-items:center;flex:none;width:40px;height:40px;margin-right:-.5rem;border:0;border-radius:8px;background:transparent;color:inherit;font:inherit;font-size:1.35rem;cursor:pointer}
.notice-x:hover{background:color-mix(in srgb,currentColor 12%,transparent)}
body.maint-on .nav,body.maint-on .skip{display:none}
.maint{display:grid;place-items:center;min-height:calc(100dvh - 11rem);padding-block:2.5rem 4rem}
.maint-card{width:100%;max-width:36rem}
.maint h1{margin-top:1.1rem;font-size:clamp(2.1rem,8vw,3.6rem);font-weight:900;font-stretch:125%;line-height:1;letter-spacing:-.025em}
.maint .lead{margin-top:1rem}
.mbar{height:10px;margin-top:2rem;border-radius:999px;background:var(--line);overflow:hidden}
.mbar span{display:block;height:100%;border-radius:999px;background:var(--strap);transition:width .6s ease}
.mleft{display:flex;justify-content:space-between;gap:1rem;margin-top:.6rem;font-size:.92rem;font-weight:600;color:var(--muted)}
.msteps{display:grid;gap:.5rem;list-style:none;margin:1.75rem 0 0;padding:0}
.msteps li{display:flex;align-items:center;gap:.7rem;font-weight:600;color:var(--muted)}
.msteps li::before{content:"";flex:none;width:.8rem;height:.8rem;border-radius:50%;border:2px solid var(--line)}
.msteps li.now{color:var(--ink)}
.msteps li.now::before{border-color:var(--strap);background:radial-gradient(circle,var(--strap) 40%,transparent 45%)}
.msteps li.ok{color:var(--ink)}
.msteps li.ok::before{border-color:var(--ok,#5BD9A0);background:var(--ok,#5BD9A0)}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex:1 1 auto}
.getapp{display:inline-flex;align-items:center;gap:.45rem;min-height:40px;padding:0 .9rem 0 .75rem;border:0;border-radius:999px;background:var(--strap);color:#0B1533;font:inherit;font-size:.92rem;font-weight:800;cursor:pointer;white-space:nowrap}
.getapp svg{width:1.15rem;height:1.15rem}
.getapp:hover{background:#F2C400}
.getapp:focus-visible{outline:3px solid #FFFFFF;outline-offset:3px}
.getapp[hidden],body.maint-on .getapp{display:none}
@media (max-width:22.5rem){.getapp-more{display:none}.brandrow{gap:.5rem}}
.sheet{width:min(30rem,calc(100% - 2rem));max-height:calc(100dvh - 2rem);margin:auto;padding:0;border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--ink)}
.sheet::backdrop{background:rgba(4,8,26,.72)}
.sheet-in{display:grid;gap:1rem;padding:1.4rem 1.4rem 1.5rem}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}
.sheet h2{font-size:1.45rem;font-weight:900;font-stretch:118%;line-height:1.1}
.sheet-x{display:grid;place-items:center;flex:none;width:40px;height:40px;margin:-.4rem -.5rem 0 0;border:0;border-radius:10px;background:transparent;color:var(--muted);font:inherit;font-size:1.5rem;cursor:pointer}
.sheet-x:hover{background:var(--surface-2,#18235A);color:var(--ink)}
.sheet p{color:var(--muted)}
.steps{display:grid;gap:.75rem;list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{display:flex;align-items:center;gap:.8rem;counter-increment:s;font-weight:600;line-height:1.35}
.steps li::before{content:counter(s);display:grid;place-items:center;flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--strap);color:#0B1533;font-weight:900}
.steps .ico{display:inline-grid;place-items:center;vertical-align:-.3em;width:1.6rem;height:1.6rem;margin:0 .15rem;border-radius:6px;background:var(--bg);color:var(--link)}
.steps .ico svg{width:1.05rem;height:1.05rem}
.foot{border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
.foot .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.4rem 2rem;padding-block:1.4rem}
.foot strong{color:var(--ink)}

@media (min-width:60rem){
  .home{grid-template-columns:minmax(0,1.85fr) minmax(17rem,1fr);gap:3.25rem;align-items:start}
  .chyron{margin:-3.4rem 0 0 1.5rem}
}
@media (prefers-reduced-motion:no-preference){
  .hero.intro .strap-row{animation:wipe .5s .2s cubic-bezier(.2,.7,.2,1) both}
  .hero.intro .band{animation:wipe .65s .38s cubic-bezier(.2,.7,.2,1) both}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none !important;animation:none !important}
}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
</style>
</head>
<body>
<a class="skip" href="#main">Ugrás a tartalomhoz</a>
<div id="notice"></div>

<header class="wrap top">
  <div class="brandrow">
    <a class="logo" href="#/" aria-label="Tények++ főoldal">Tények<b>++</b></a>
    <button class="getapp" type="button" id="getapp" data-getapp hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="m7 10.5 5 5 5-5"/><path d="M5 20h14"/></svg>App<span class="getapp-more"> letöltése</span></button>

</header>

<main id="main" tabindex="-1"></main>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title"><div class="sheet-in" id="sheet-in"></div></dialog>

<footer class="foot">
  <div class="wrap">
    <p><strong>Tények++</strong>, a Creascola diákhíradója.</p>
    <p>Diákprojekt, nem áll kapcsolatban egyetlen tévécsatornával sem.</p>
  </div>
</footer>

<script src="config.js"></script>
<script>
const EMAIL = "balazs.kiss@creascola.hu";

const CFG = window.TENYEK_CONFIG || {};
const DB = !!(CFG.supabaseUrl && CFG.supabaseKey);
const CACHE_KEY = "tenyek-episodes-v1";

const FALLBACK = [
  { id: "projectweek", title: "Science Project Week", youtube_id: "4ZmK71TnYvI" },
  { id: "bubblehub_dok", title: "Bubble hub + DÖK", youtube_id: "RO4DFEYFavw" },
  { id: "aradi-vertanuk", title: "Aradi vértanúk", youtube_id: "-ELn2qGqOfA" },
  { id: "erdei-iskola-7-evfolyam", title: "Erdei iskola, 7. évfolyam", youtube_id: "Uu-Bblt1ZDE" }
];

const ALL = "Összes";
const PLAY_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5v17a1 1 0 0 0 1.5.86l14.5-8.5a1 1 0 0 0 0-1.72L6.5 2.64A1 1 0 0 0 5 3.5z"/></svg>';

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const ytId = v => {
  if (!v) return "";
  const s = String(v).trim();
  const m = s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/);
  if (m) return m[1];
  return /^[\w-]{11}$/.test(s) ? s : "";
};

let eps = [];
let categories = [ALL];
let dataSig = "";
let pending = false;

function setEpisodes(rows) {
  eps = rows.map((r, i) => ({
    id: r.id,
    title: r.title,
    date: r.aired_on || "",
    category: r.category || "",
    summary: r.summary || "",
    yt: ytId(r.youtube_id),
    no: rows.length - i
  }));
  categories = [ALL, ...new Set(eps.map(e => e.category).filter(Boolean))];
  if (!categories.includes(state.cat)) state.cat = ALL;
}

function api(path, opts = {}) {
  return fetch(`${CFG.supabaseUrl.replace(/\/$/, "")}/rest/v1/${path}`, {
    ...opts,
    headers: { apikey: CFG.supabaseKey, "Content-Type": "application/json", ...(opts.headers || {}) }
  });
}

function useRows(rows, sig) {
  if (sig === dataSig) return false;
  dataSig = sig;
  setEpisodes(rows);
  return true;
}

let lastLoad = 0;
async function loadEpisodes() {
  if (!DB) return;
  lastLoad = Date.now();
  try {
    const res = await api("episodes?select=id,title,youtube_id,aired_on,category,summary&order=aired_on.desc.nullslast,created_at.desc");
    if (!res.ok) throw new Error(String(res.status));
    const rows = await res.json();
    const sig = JSON.stringify(rows);
    try { localStorage.setItem(CACHE_KEY, sig); } catch (e) {}
    const wasPending = pending;
    pending = false;
    if (useRows(rows, sig) || wasPending) refreshView();
  } catch (e) {
    if (pending) {
      pending = false;
      useRows(FALLBACK, JSON.stringify(FALLBACK));
      refreshView();
    }
  }
}

function boot() {
  let cached = null;
  if (DB) {
    try { cached = localStorage.getItem(CACHE_KEY); } catch (e) {}
  }
  if (cached) {
    try { useRows(JSON.parse(cached), cached); } catch (e) { cached = null; }
  }
  if (!DB) useRows(FALLBACK, JSON.stringify(FALLBACK));
  else if (!cached) pending = true;
}
const fmtLong = new Intl.DateTimeFormat("hu-HU", { year: "numeric", month: "long", day: "numeric" });
const fmtShort = new Intl.DateTimeFormat("hu-HU", { month: "short", day: "numeric" });
const toDate = s => new Date(s + "T12:00:00");
const longDate = e => !e.date ? "" : `<time datetime="${esc(e.date)}">${esc(fmtLong.format(toDate(e.date)))}</time>`;
const shortDate = e => !e.date ? "" : `<time datetime="${esc(e.date)}">${esc(fmtShort.format(toDate(e.date)))}</time>`;
const catTag = e => (e.category ? `<span class="cat">${esc(e.category)}</span>` : "");
const epHref = e => `#/adas/${encodeURIComponent(e.id)}`;

const state = { q: "", cat: ALL };
const main = document.getElementById("main");
let firstRender = true;
let introPlayed = false;
const loadingView = () => `<div class="wrap page"><p class="loading" role="status">Adások betöltése…</p></div>`;

function screen(ep, player) {
  const thumb = ep.yt ? `<img class="thumb" src="https://i.ytimg.com/vi/${ep.yt}/hqdefault.jpg" alt="" loading="lazy">` : "";
  const no = `<span class="no">${ep.no}. adás</span>`;
  let mid = "";
  if (!ep.yt) mid = `<span class="soon"><span>A videó hamarosan felkerül</span></span>`;
  else if (player) mid = `<button class="play" type="button" data-play="${esc(ep.id)}" aria-label="Lejátszás: ${esc(ep.title)}"><span class="disc">${PLAY_ICON}</span></button>`;
  else mid = `<span class="play" aria-hidden="true"><span class="disc">${PLAY_ICON}</span></span>`;
  return `<div class="screen">${thumb}${no}${mid}</div>`;
}

function home() {
  if (pending) return loadingView();
  if (!eps.length) {
    return `<div class="wrap page"><h1 class="page-title">Tények++</h1><p class="page-sub">Még nincs feltöltött adás. Addig is küldd el, miről szeretnél riportot látni.</p><p class="actions"><a class="btn" href="#/kuldj-sztorit">Küldj sztorit</a></p></div>`;
  }
  const [lead, ...rest] = eps;
  const rows = rest.slice(0, 5).map(e => `
    <li><a class="row" href="${epHref(e)}">
      <span class="row-no" aria-hidden="true">${e.no}</span>
      <span><span class="row-title">${esc(e.title)}</span>
      ${e.category || e.date ? `<span class="meta">${catTag(e)}${shortDate(e)}</span>` : ""}</span>
    </a></li>`).join("");
  const rundown = rest.length ? `
    <aside class="rundown" aria-labelledby="rundown-title">
      <h2 id="rundown-title">Korábbi adások</h2>
      <ul class="rows">${rows}</ul>
      <a class="btn ghost" href="#/adasok">Összes adás</a>
    </aside>` : "";
  return `
  <div class="wrap home">
    <article class="hero${introPlayed ? "" : " intro"}">
      ${screen(lead, true)}
      <div class="chyron">
        <p class="strap-row"><span class="strap">Legfrissebb adás</span>${lead.date ? `<span class="strap-date">${longDate(lead)}</span>` : ""}</p>
        <div class="band"><h1><a href="${epHref(lead)}">${esc(lead.title)}</a></h1></div>
      </div>
      ${lead.summary ? `<p class="lead">${esc(lead.summary)}</p>` : ""}
      <a class="textlink${lead.summary ? "" : " solo"}" href="${epHref(lead)}">Az adás oldala</a>
    </article>
    ${rundown}
  </div>
  <div class="wrap" id="appcard-slot">${appCard()}</div>
  <section class="tipband" aria-labelledby="tipband-title">
    <div class="wrap">
      <div>
        <h2 id="tipband-title">Történt valami, amiről tudnunk kéne?</h2>
        <p>Küldd el a sztorid, vagy kérd, hogy készítsünk riportot egy témáról.</p>
      </div>
      <a class="btn ink" href="#/kuldj-sztorit">Küldj sztorit</a>
    </div>
  </section>`;
}

function filtered() {
  const q = state.q.trim().toLocaleLowerCase("hu");
  return eps.filter(e =>
    (state.cat === ALL || e.category === state.cat) &&
    (!q || `${e.title} ${e.summary || ""} ${e.category || ""}`.toLocaleLowerCase("hu").includes(q))
  );
}

function gridHtml(list) {
  if (!list.length) return `<p class="empty">Nincs találat. Próbálj más keresőszót.</p>`;
  return `<ul class="grid">${list.map(e => `
    <li class="item"><a href="${epHref(e)}">
      ${screen(e, false)}
      ${e.category || e.date ? `<p class="meta">${catTag(e)}${longDate(e)}</p>` : ""}
      <h2>${esc(e.title)}</h2>
    </a></li>`).join("")}</ul>`;
}

function refreshGrid() {
  const list = filtered();
  const grid = document.getElementById("grid");
  const count = document.getElementById("count");
  if (grid) grid.innerHTML = gridHtml(list);
  if (count) count.textContent = `${list.length} adás`;
}

function archive() {
  if (pending) return loadingView();
  const list = filtered();
  const chips = categories.map(c => `<button class="chip" type="button" data-cat="${esc(c)}" aria-pressed="${c === state.cat}">${esc(c)}</button>`).join("");
  return `
  <div class="wrap page">
    <h1 class="page-title">Adások</h1>
    <p class="page-sub">Minden eddigi Tények++ adás egy helyen.</p>
    <div class="controls">
      <div class="search">
        <label class="vh" for="q">Keresés az adások között</label>
        <input id="q" type="search" placeholder="Keresés az adások között" value="${esc(state.q)}" autocomplete="off">
      </div>
      ${categories.length > 2 ? `<div class="chips" role="group" aria-label="Szűrés rovat szerint">${chips}</div>` : ""}
    </div>
    <p class="count" id="count" role="status">${list.length} adás</p>
    <div id="grid">${gridHtml(list)}</div>
  </div>`;
}

function episode(ep) {
  const i = eps.indexOf(ep);
  const older = eps[i + 1];
  const newer = eps[i - 1];
  const yt = ep.yt ? `<a class="textlink" href="https://www.youtube.com/watch?v=${ep.yt}" target="_blank" rel="noopener">Megnyitás a YouTube-on</a>` : "";
  const pager = older || newer ? `
    <nav class="pager" aria-label="További adások">
      ${older ? `<a class="prev" href="${epHref(older)}"><small>Előző adás</small><strong>${esc(older.title)}</strong></a>` : "<span></span>"}
      ${newer ? `<a class="next" href="${epHref(newer)}"><small>Következő adás</small><strong>${esc(newer.title)}</strong></a>` : ""}
    </nav>` : "";
  return `
  <div class="wrap page">
    <article class="episode">
      <a class="back" href="#/adasok">Vissza az adásokhoz</a>
      ${screen(ep, true)}
      ${ep.category || ep.date ? `<p class="strap-row">${ep.category ? `<span class="strap">${esc(ep.category)}</span>` : ""}${ep.date ? `<span class="strap-date">${longDate(ep)}</span>` : ""}</p>` : ""}
      <h1>${esc(ep.title)}</h1>
      ${ep.summary ? `<p class="lead">${esc(ep.summary)}</p>` : ""}
      ${yt}
      ${pager}
    </article>
  </div>`;
}

function staff() {
  return `
  <div class="wrap page">
    <h1 class="page-title">Stáb</h1>
    <p class="page-sub">A Tények++ a Creascola diákhíradója. Rövid videós adásokban mutatjuk meg, mi történik a suliban.</p>
    <div class="people">
      <article class="person">
        <div class="mono" aria-hidden="true">KB</div>
        <div>
          <h2>Kiss Balázs</h2>
          <p class="role">Szerkesztő és riporter</p>
          <p class="bio">Ő állítja össze az adásokat, és ő készíti a riportokat. Ha témád van, vagy szerepelnél egy adásban, neki írj.</p>
          <p class="actions">
            <a class="btn" href="mailto:${EMAIL}">E-mail küldése</a>
            <button class="btn ghost" type="button" data-copy>Cím másolása</button>
          </p>
        </div>
      </article>
      <article class="person">
        <div class="mono" aria-hidden="true">KO</div>
        <div>
          <h2>Kiss Olivér</h2>
          <p class="role">Operatőr és produkciós asszisztens</p>
          <p class="bio">Ő áll a kamera mögött, és segít abban, hogy minden forgatás összeálljon.</p>
        </div>
      </article>
    </div>
  </div>`;
}

function tip() {
  return `
  <div class="wrap page">
    <h1 class="page-title">Küldj sztorit</h1>
    <p class="page-sub">Láttál vagy hallottál valamit a suliban? Írd meg, vagy kérd, hogy készítsünk róla riportot.</p>
    <div class="tip">
      <div class="form" id="tip-form">
        <fieldset class="seg">
          <legend class="vh">Mit szeretnél?</legend>
          <label><input type="radio" name="kind" value="story" checked><span>Sztorit küldök</span></label>
          <label><input type="radio" name="kind" value="request"><span>Riportot kérek</span></label>
        </fieldset>
        <div class="field" id="fw-name">
          <label for="f-name">Neved</label>
          <input id="f-name" type="text" autocomplete="name" maxlength="80" aria-describedby="e-name">
          <p class="err" id="e-name" hidden></p>
        </div>
        <div class="field">
          <label for="f-class">Osztályod <small>(nem kötelező)</small></label>
          <input id="f-class" type="text" placeholder="pl. 10.B" autocomplete="off" maxlength="20">
        </div>
        <div class="field">
          <label for="f-contact">Elérhetőséged <small>(nem kötelező, ha vissza kellene írnunk)</small></label>
          <input id="f-contact" type="text" placeholder="e-mail vagy Instagram" autocomplete="off" maxlength="120">
        </div>
        <div class="field" id="fw-topic">
          <label for="f-topic" id="l-topic">Miről van szó?</label>
          <input id="f-topic" type="text" placeholder="Egy mondatban" autocomplete="off" maxlength="200" aria-describedby="e-topic">
          <p class="err" id="e-topic" hidden></p>
        </div>
        <div class="field" id="fw-details">
          <label for="f-details">Részletek</label>
          <textarea id="f-details" placeholder="Mi történt, mikor, hol, kik voltak ott?" maxlength="4000" aria-describedby="e-details"></textarea>
          <p class="err" id="e-details" hidden></p>
        </div>
        <div class="field">
          <label for="f-link">Link fotóhoz vagy videóhoz <small>(nem kötelező)</small></label>
          <input id="f-link" type="url" placeholder="https://" autocomplete="off" inputmode="url" maxlength="500">
        </div>
        <div class="hp" aria-hidden="true">
          <label for="f-website">Weboldal</label>
          <input id="f-website" type="text" tabindex="-1" autocomplete="off">
        </div>
        <div>
          <button class="btn" type="button" data-send>Beküldés</button>
        </div>
        <p class="hint">${DB ? "A beküldött sztorikat csak a szerkesztőség látja." : "A gomb megnyitja a levelezőprogramodat egy kész levéllel. Elküldés előtt még átírhatod."}</p>
        <div class="status" id="tip-status" role="status" hidden></div>
      </div>
      <aside class="side" aria-labelledby="side-title">
        <h2 id="side-title">Inkább simán írnál?</h2>
        <p>Minden levél a szerkesztőhöz érkezik.</p>
        <a class="mail" href="mailto:${EMAIL}">${EMAIL}</a>
        <p class="actions"><button class="btn ghost" type="button" data-copy>Cím másolása</button></p>
      </aside>
    </div>
  </div>`;
}

function missing(what) {
  const text = what === "episode"
    ? "Ezt az adást nem találjuk. Lehet, hogy átneveztük vagy töröltük."
    : "Ez az oldal nem létezik. Lehet, hogy elírtad a címet.";
  return `<div class="wrap page"><h1 class="page-title">Nincs ilyen oldal</h1><p class="page-sub">${text}</p><p class="actions"><a class="btn" href="#/adasok">Vissza az adásokhoz</a></p></div>`;
}

const MAINT = {
  start: Date.parse("2026-11-27T23:00:00+01:00"),
  end: Date.parse("2026-11-28T01:00:00+01:00"),
  doneUntil: Date.parse("2026-11-29T00:00:00+01:00")
};
const MAINT_STEPS = ["Rendszer leállítása", "Új adatbázis bekapcsolása", "Értesítések és telepíthető alkalmazás", "Sztoribeküldés a szerkesztőségnek", "Végső ellenőrzés"];
const MAINT_DISMISS = "tenyek-update-2026-11-28";
const INFO_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2.5 20h19z"/><path d="M12 10v4.5M12 17.5v.01"/></svg>';
const CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="m7.5 12.3 3 3 6-6.3"/></svg>';

function maintPhase(now = Date.now()) {
  if (now < MAINT.start) return "before";
  if (now < MAINT.end) return "during";
  if (now < MAINT.doneUntil) return "after";
  return "off";
}

function renderNotice() {
  const box = document.getElementById("notice");
  const phase = maintPhase();
  let dismissed = false;
  try { dismissed = localStorage.getItem(MAINT_DISMISS) === "1"; } catch (e) {}
  if (phase === "before") {
    box.innerHTML = `<div class="notice" role="status"><div class="wrap">${INFO_ICON}<p><strong>Frissítés ma éjjel:</strong> 23:00 és 01:00 között új funkciókat telepítünk, ez idő alatt az oldal nem érhető el.</p></div></div>`;
  } else if (phase === "after" && !dismissed) {
    box.innerHTML = `<div class="notice done" role="status"><div class="wrap">${CHECK_ICON}<p><strong>Elkészült a frissítés!</strong> Mostantól értesítést kérhetsz az új adásokról, és a telefonodra is telepítheted a Tények++-t.</p><button class="notice-x" type="button" data-notice-x aria-label="Értesítés bezárása">×</button></div></div>`;
  } else {
    box.innerHTML = "";
  }
}

function maintLeft(now = Date.now()) {
  const mins = Math.max(1, Math.ceil((MAINT.end - now) / 60000));
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return h ? `még ${h} óra${m ? ` ${m} perc` : ""}` : `még ${m} perc`;
}

function maintView() {
  return `<div class="wrap maint"><section class="maint-card" aria-labelledby="maint-title">
    <p class="strap-row"><span class="strap">Karbantartás</span><span class="strap-date">23:00 – 01:00</span></p>
    <h1 id="maint-title">Hamarosan visszajövünk</h1>
    <p class="lead">Épp új funkciókat telepítünk a Tények++-ra. Az oldal hajnali 1 órakor tér vissza, addig nem érhetők el az adások és a sztoribeküldés.</p>
    <div class="mbar" role="progressbar" aria-label="A frissítés állapota" aria-valuemin="0" aria-valuemax="100" id="mbar"><span id="mbar-fill"></span></div>
    <p class="mleft"><span id="mpct"></span><span id="mleft"></span></p>
    <ul class="msteps" id="msteps"></ul>
  </section></div>`;
}

function updateMaint() {
  const fill = document.getElementById("mbar-fill");
  if (!fill) return;
  const now = Date.now();
  const pct = Math.min(99, Math.max(1, Math.floor((now - MAINT.start) / (MAINT.end - MAINT.start) * 100)));
  fill.style.width = `${pct}%`;
  document.getElementById("mbar").setAttribute("aria-valuenow", String(pct));
  document.getElementById("mpct").textContent = `${pct}%`;
  document.getElementById("mleft").textContent = `Vissza 01:00-kor, ${maintLeft(now)}`;
  const step = Math.min(MAINT_STEPS.length - 1, Math.floor(pct / (100 / MAINT_STEPS.length)));
  document.getElementById("msteps").innerHTML = MAINT_STEPS.map((s, i) => `<li class="${i < step ? "ok" : i === step ? "now" : ""}">${s}</li>`).join("");
}

function route(quiet) {
  const hash = location.hash;
  if (maintPhase() === "during") {
    document.body.classList.add("maint-on");
    main.innerHTML = maintView();
    updateMaint();
    document.title = "Karbantartás | Tények++";
    document.querySelectorAll("[data-nav]").forEach(a => a.removeAttribute("aria-current"));
    firstRender = false;
    return;
  }
  document.body.classList.remove("maint-on");
  if (hash && !hash.startsWith("#/")) return;
  const seg = hash.slice(2).split("/").filter(Boolean);
  let html, title = "", key = "";
  if (!seg.length) { html = home(); key = "/"; }
  else if (seg[0] === "adasok") { html = archive(); title = "Adások"; key = "/adasok"; }
  else if (seg[0] === "adas") {
    let id = seg[1] || "";
    try { id = decodeURIComponent(id); } catch (e) {}
    const ep = eps.find(e => e.id === id);
    html = pending ? loadingView() : ep ? episode(ep) : missing("episode");
    title = pending ? "Adás" : ep ? ep.title : "Nincs ilyen oldal";
    key = "/adasok";
  }
  else if (seg[0] === "stab") { html = staff(); title = "Stáb"; key = "/stab"; }
  else if (seg[0] === "kuldj-sztorit") { html = tip(); title = "Küldj sztorit"; key = "/kuldj-sztorit"; }
  else { html = missing(); title = "Nincs ilyen oldal"; }
  main.innerHTML = html;
  if (main.querySelector(".hero")) introPlayed = true;
  document.title = title ? `${title} | Tények++` : "Tények++, a Creascola diákhíradója";
  document.querySelectorAll("[data-nav]").forEach(a => {
    if (a.dataset.nav === key) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
  if (!firstRender && !quiet) {
    window.scrollTo(0, 0);
    main.focus({ preventScroll: true });
  }
  firstRender = false;
}

function routeKey() {
  return (location.hash.slice(2).split("/").filter(Boolean)[0]) || "";
}

function refreshView() {
  if (document.querySelector(".screen[data-playing]")) return;
  if (["", "adasok", "adas"].includes(routeKey())) route(true);
}

function blocked(box, ep) {
  box.removeAttribute("data-playing");
  box.innerHTML = `<span class="no">${ep.no}. adás</span><div class="blocked"><p>Ezen az oldalon nem indul el a videó.</p><a class="btn" href="https://www.youtube.com/watch?v=${ep.yt}" target="_blank" rel="noopener">Megnyitás a YouTube-on</a></div>`;
}

function play(btn) {
  const ep = eps.find(e => e.id === btn.dataset.play);
  if (!ep || !ep.yt) return;
  const box = btn.closest(".screen");
  const hero = box.closest(".hero");
  if (hero) hero.classList.add("is-playing");
  if (location.protocol !== "http:" && location.protocol !== "https:") {
    blocked(box, ep);
    return;
  }
  box.dataset.playing = ep.id;
  box.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${ep.yt}?autoplay=1&rel=0" title="${esc(ep.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;
}

document.addEventListener("securitypolicyviolation", e => {
  const directive = e.effectiveDirective || e.violatedDirective || "";
  if (!/frame-src|child-src|default-src/.test(directive)) return;
  if (!/youtube/i.test(e.blockedURI || "")) return;
  document.querySelectorAll(".screen[data-playing]").forEach(box => {
    const ep = eps.find(x => x.id === box.dataset.playing);
    if (ep) blocked(box, ep);
  });
});

async function copyEmail(btn) {
  let ok = false;
  try {
    await navigator.clipboard.writeText(EMAIL);
    ok = true;
  } catch (e) {
    const t = document.createElement("textarea");
    t.value = EMAIL;
    t.setAttribute("readonly", "");
    t.style.position = "fixed";
    t.style.opacity = "0";
    document.body.appendChild(t);
    t.select();
    try { ok = document.execCommand("copy"); } catch (e2) {}
    t.remove();
  }
  if (!btn.dataset.label) btn.dataset.label = btn.textContent;
  btn.textContent = ok ? "Cím kimásolva" : EMAIL;
  clearTimeout(btn._t);
  btn._t = setTimeout(() => { btn.textContent = btn.dataset.label; }, 2200);
}

function setError(name, message) {
  const wrap = document.getElementById(`fw-${name}`);
  const err = document.getElementById(`e-${name}`);
  const input = document.getElementById(`f-${name}`);
  wrap.classList.toggle("bad", !!message);
  err.hidden = !message;
  err.textContent = message || "";
  if (message) input.setAttribute("aria-invalid", "true");
  else input.removeAttribute("aria-invalid");
}

function updateKind() {
  const request = document.querySelector('input[name="kind"]:checked').value === "request";
  document.getElementById("l-topic").textContent = request ? "Miről készítsünk riportot?" : "Miről van szó?";
  document.getElementById("f-details").placeholder = request ? "Miért érdekes, és kit érdemes megkérdezni?" : "Mi történt, mikor, hol, kik voltak ott?";
}

function mailUrl(p) {
  const subject = `[Tények++] ${p.kind === "request" ? "Riportkérés" : "Sztori"}: ${p.topic}`;
  const lines = [`Név: ${p.name}`];
  if (p.class_name) lines.push(`Osztály: ${p.class_name}`);
  if (p.contact) lines.push(`Elérhetőség: ${p.contact}`);
  lines.push("", p.kind === "request" ? "Erről kérek riportot:" : "A sztori:", p.details);
  if (p.link) lines.push("", `Link: ${p.link}`);
  return `mailto:${EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(lines.join("\n"))}`;
}

function openMail(url) {
  const a = document.createElement("a");
  a.href = url;
  a.style.display = "none";
  document.body.appendChild(a);
  try { a.click(); } catch (e) {}
  a.remove();
}

function showSent() {
  const form = document.getElementById("tip-form");
  if (!form) return;
  form.innerHTML = `<div class="done" tabindex="-1" role="status"><h2>Megkaptuk, köszönjük!</h2><p>A szerkesztőség átnézi a beküldésed. Ha adás lesz belőle, itt az oldalon fogod látni.</p><button class="btn ghost" type="button" data-again>Új beküldés</button></div>`;
  form.querySelector(".done").focus();
}

async function send(btn) {
  const val = id => document.getElementById(id).value.trim();
  const request = document.querySelector('input[name="kind"]:checked').value === "request";
  const p = {
    kind: request ? "request" : "story",
    name: val("f-name"),
    class_name: val("f-class") || null,
    contact: val("f-contact") || null,
    topic: val("f-topic"),
    details: val("f-details"),
    link: val("f-link") || null
  };
  setError("name", p.name ? "" : "Írd be a neved.");
  setError("topic", p.topic ? "" : "Írd le egy mondatban, miről van szó.");
  setError("details", p.details.length >= 10 ? "" : "Írj legalább pár szót a részletekről.");
  const firstBad = document.querySelector(".field.bad input, .field.bad textarea");
  const status = document.getElementById("tip-status");
  if (firstBad) {
    status.hidden = true;
    firstBad.focus();
    return;
  }
  if (val("f-website")) { showSent(); return; }
  const url = mailUrl(p);
  if (!DB) {
    status.innerHTML = `Megnyitottuk a levelezőt a kész levéllel, már csak el kell küldened. Ha nem történt semmi, <a href="${esc(url)}">nyisd meg innen</a>, vagy írj közvetlenül a <strong>${EMAIL}</strong> címre.`;
    status.hidden = false;
    openMail(url);
    return;
  }
  btn.disabled = true;
  btn.textContent = "Küldés…";
  status.hidden = true;
  try {
    const res = await api("stories", { method: "POST", headers: { Prefer: "return=minimal" }, body: JSON.stringify(p) });
    if (!res.ok) throw new Error(String(res.status));
    showSent();
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "Beküldés";
    status.innerHTML = `Most nem sikerült elküldeni. Próbáld újra pár perc múlva, vagy <a href="${esc(url)}">küldd el e-mailben</a>.`;
    status.hidden = false;
  }
}

const BELL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const canPush = DB && !!CFG.vapidPublicKey && "serviceWorker" in navigator && "PushManager" in window && "Notification" in window && (location.protocol === "https:" || location.hostname === "localhost");
const app = { install: null, subscribed: false, busy: false, msg: "" };

function appCard() {
  const iosGuide = isIOS && !isStandalone() && !canPush;
  if (!canPush && !app.install && !iosGuide) return "";
  let text = "Kapj értesítést a telefonodra, amikor új adás jelenik meg.";
  const buttons = [];
  if (iosGuide) {
    text = "iPhone-on add hozzá az oldalt a főképernyőhöz: koppints a Megosztás gombra, majd a „Főképernyőhöz adás” pontra. Onnan megnyitva tudsz értesítést kérni.";
  } else if (canPush) {
    if (Notification.permission === "denied") {
      text = "Az értesítések le vannak tiltva ezen az eszközön. A böngésző vagy a telefon beállításaiban tudod újra engedélyezni.";
    } else if (app.subscribed) {
      text = "Bekapcsoltad: szólunk, amikor új adás jelenik meg.";
      buttons.push(`<button class="btn ghost" type="button" data-push-off ${app.busy ? "disabled" : ""}>Értesítések kikapcsolása</button>`);
    } else {
      buttons.push(`<button class="btn" type="button" data-push-on ${app.busy ? "disabled" : ""}>Értesítést kérek</button>`);
    }
  }
  if (app.install && !isStandalone()) buttons.push(`<button class="btn ghost" type="button" data-install>Telepítés a telefonra</button>`);
  return `<section class="appcard" aria-labelledby="app-title">
    <span class="bell">${BELL}</span>
    <div><h2 id="app-title">Ne maradj le a következő adásról</h2><p>${text}</p></div>
    ${buttons.length ? `<div class="actions">${buttons.join("")}</div>` : ""}
    ${app.msg ? `<p class="appmsg" role="status">${esc(app.msg)}</p>` : ""}
  </section>`;
}

function updateAppCard() {
  const slot = document.getElementById("appcard-slot");
  if (slot) slot.innerHTML = appCard();
}

function b64ToBytes(b64) {
  const pad = "=".repeat((4 - (b64.length % 4)) % 4);
  const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}

function swReady() {
  return Promise.race([
    navigator.serviceWorker.ready,
    new Promise((_, reject) => setTimeout(() => reject(new Error("sw timeout")), 10000))
  ]);
}

async function pushOn() {
  app.busy = true;
  app.msg = "";
  updateAppCard();
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") throw new Error("denied");
    const reg = await swReady();
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(CFG.vapidPublicKey) });
    const j = sub.toJSON();
    const res = await api("rpc/push_subscribe", { method: "POST", body: JSON.stringify({ p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth }) });
    if (!res.ok) throw new Error(String(res.status));
    app.subscribed = true;
    app.msg = "Kész! Az első értesítés a következő adásnál érkezik.";
  } catch (e) {
    app.msg = Notification.permission === "denied" ? "" : "Nem sikerült bekapcsolni az értesítéseket. Próbáld újra később.";
  }
  app.busy = false;
  updateAppCard();
}

async function pushOff() {
  app.busy = true;
  app.msg = "";
  updateAppCard();
  try {
    const reg = await swReady();
    const sub = await reg.pushManager.getSubscription();
    if (sub) {
      await api("rpc/push_unsubscribe", { method: "POST", body: JSON.stringify({ p_endpoint: sub.endpoint }) });
      await sub.unsubscribe();
    }
    app.subscribed = false;
    app.msg = "Kikapcsoltad az értesítéseket.";
  } catch (e) {
    app.msg = "Nem sikerült kikapcsolni. Próbáld újra később.";
  }
  app.busy = false;
  updateAppCard();
}

const SHARE_ICON = '<span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7.5 7.5 4.5-4.5 4.5 4.5"/><path d="M6 11H5v10h14V11h-1"/></svg></span>';
const PLUS_ICON = '<span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8.5v7M8.5 12h7"/></svg></span>';

function updateGetApp() {
  const btn = document.getElementById("getapp");
  if (btn) btn.hidden = isStandalone() || !(isIOS || app.install);
}

function openGetApp() {
  if (app.install) { installApp(); return; }
  const sheet = document.getElementById("sheet");
  document.getElementById("sheet-in").innerHTML = `
    <div class="sheet-head"><h2 id="sheet-title">Tények++ a telefonodon</h2><button class="sheet-x" type="button" data-sheet-x aria-label="Bezárás">×</button></div>
    <p>Add hozzá a főképernyőhöz, és úgy nyílik meg, mint egy app. Utána értesítést is kérhetsz az új adásokról.</p>
    <ol class="steps">
      <li><span>Koppints a ${SHARE_ICON} Megosztás gombra a böngésző alján vagy tetején.</span></li>
      <li><span>Görgess le, és válaszd a ${PLUS_ICON} „Főképernyőhöz adás” pontot.</span></li>
      <li><span>Koppints a „Hozzáadás” gombra, majd nyisd meg a Tények++ ikont.</span></li>
    </ol>
    <button class="btn" type="button" data-sheet-x>Rendben</button>`;
  try { sheet.showModal(); } catch (e) { sheet.setAttribute("open", ""); }
}

function closeGetApp() {
  const sheet = document.getElementById("sheet");
  try { sheet.close(); } catch (e) { sheet.removeAttribute("open"); }
}

async function installApp() {
  const ev = app.install;
  if (!ev) return;
  app.install = null;
  try {
    ev.prompt();
    await ev.userChoice;
  } catch (e) {}
  updateAppCard();
  updateGetApp();
}

document.addEventListener("click", e => {
  if (e.target.closest("[data-getapp]")) { openGetApp(); return; }
  if (e.target.closest("[data-sheet-x]") || e.target.id === "sheet") { closeGetApp(); return; }
  const playBtn = e.target.closest("[data-play]");
  if (playBtn) { play(playBtn); return; }
  const chip = e.target.closest("[data-cat]");
  if (chip) {
    state.cat = chip.dataset.cat;
    document.querySelectorAll("[data-cat]").forEach(c => c.setAttribute("aria-pressed", String(c === chip)));
    refreshGrid();
    return;
  }
  const copyBtn = e.target.closest("[data-copy]");
  if (copyBtn) { copyEmail(copyBtn); return; }
  const sendBtn = e.target.closest("[data-send]");
  if (sendBtn) { send(sendBtn); return; }
  if (e.target.closest("[data-again]")) { route(true); return; }
  if (e.target.closest("[data-push-on]")) { pushOn(); return; }
  if (e.target.closest("[data-push-off]")) { pushOff(); return; }
  if (e.target.closest("[data-install]")) { installApp(); return; }
  if (e.target.closest("[data-notice-x]")) {
    try { localStorage.setItem(MAINT_DISMISS, "1"); } catch (err) {}
    renderNotice();
  }
});

document.addEventListener("input", e => {
  if (e.target.id === "q") {
    state.q = e.target.value;
    refreshGrid();
    return;
  }
  const field = e.target.closest(".field.bad");
  if (field && e.target.value.trim()) setError(field.id.replace("fw-", ""), "");
});

document.addEventListener("change", e => {
  if (e.target.name === "kind") updateKind();
});

document.addEventListener("error", e => {
  if (e.target instanceof HTMLImageElement && e.target.classList.contains("thumb")) e.target.remove();
}, true);

window.addEventListener("hashchange", () => route());

let lastPhase = maintPhase();
function checkMaint() {
  const phase = maintPhase();
  if (phase !== lastPhase) {
    const was = lastPhase;
    lastPhase = phase;
    renderNotice();
    route(true);
    if (was === "during") loadEpisodes();
  } else if (phase === "during") {
    updateMaint();
  }
}
setInterval(checkMaint, 10000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkMaint(); });

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  app.install = e;
  updateAppCard();
  updateGetApp();
});

window.addEventListener("appinstalled", () => {
  app.install = null;
  updateAppCard();
  updateGetApp();
});

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && Date.now() - lastLoad > 60000) loadEpisodes();
});

if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register("sw.js").then(async reg => {
    if (!canPush) return;
    const sub = await reg.pushManager.getSubscription();
    if (sub && Notification.permission === "granted") {
      app.subscribed = true;
      updateAppCard();
    }
  }).catch(() => {});
}

boot();
updateGetApp();
renderNotice();
route();
loadEpisodes();
</script>
</body>
</html>
